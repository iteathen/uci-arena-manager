name: Manager Windows repair validation

# Temporary diagnostic branch only. Never merge this workflow replacement.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      VALIDATED_SOURCE_SHA: 6290cbb7b2b6bb495ca2e20b7548dea07f7bd734
      RELEASE_VERSION: '0.3.25'
      RELEASE_TARGET: windows-x86_64
    steps:
      - if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 6290cbb7b2b6bb495ca2e20b7548dea07f7bd734
      - name: Verify frozen production source
        shell: pwsh
        run: |
          $observed = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $observed -ne $env:VALIDATED_SOURCE_SHA) {
            throw 'Diagnostic checkout does not match the frozen production source'
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact dashboard dependency closure
        run: npm ci
        working-directory: web
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57
      - name: Install pinned CMake build toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '4.3.4'
          $expected = '86e5fcafb38bdf58346a78b187c7b6b4f252ae5242cffe24c463a92bbd2e77d1'
          $archive = Join-Path $env:RUNNER_TEMP "cmake-$version-windows-x86_64.zip"
          $destination = Join-Path $env:RUNNER_TEMP "cmake-$version"
          Invoke-WebRequest `
            -Uri "https://github.com/Kitware/CMake/releases/download/v$version/cmake-$version-windows-x86_64.zip" `
            -OutFile $archive
          $observed = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($observed -ne $expected) { throw 'pinned CMake archive digest mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          Add-Content -LiteralPath $env:GITHUB_PATH `
            -Value (Join-Path $destination "cmake-$version-windows-x86_64/bin")
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
      - name: Restore exact hosted vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: manager-vcpkg-v1-${{ runner.os }}-${{ env.RELEASE_TARGET }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/triplets/**') }}
      - name: Verify Manager specifications and web application
        timeout-minutes: 10
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'Manager repository checks failed' }
      - name: Install exact native dependency closure
        timeout-minutes: 90
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache
          VCPKG_BINARY_SOURCES: "clear;default,readwrite"
        run: |
          $triplet = if ($env:RELEASE_TARGET -eq 'windows-x86_64') { 'x64-windows-release' } else { 'x64-linux-release' }
          $preset = if ($env:RELEASE_TARGET -eq 'windows-x86_64') { 'windows-component-release' } else { 'linux-component-release' }
          $vcpkg = Join-Path $env:VCPKG_ROOT $(if ($IsWindows) { 'vcpkg.exe' } else { 'vcpkg' })
          $installRoot = Join-Path $PWD "build/$preset/vcpkg_installed"
          $overlayTriplets = Join-Path $PWD 'cmake/triplets'
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & $vcpkg install `
            --triplet $triplet `
            "--overlay-triplets=$overlayTriplets" `
            "--x-manifest-root=$PWD" `
            "--x-install-root=$installRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Manager native dependency installation failed' }
      - name: Configure exact Manager source
        timeout-minutes: 5
        shell: pwsh
        run: |
          cmake --preset windows-component-release "-DARENA_VERSION=$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Manager configure failed' }
      - name: Build exact Manager source
        timeout-minutes: 30
        shell: pwsh
        run: |
          cmake --build --preset windows-component-release --clean-first --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Manager build failed' }
      - name: Verify exact Manager native tests
        timeout-minutes: 10
        shell: pwsh
        run: |
          ctest --preset windows-component-release --output-on-failure --timeout 300
          if ($LASTEXITCODE -ne 0) { throw 'Manager native tests failed' }
