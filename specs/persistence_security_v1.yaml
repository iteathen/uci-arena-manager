meta:
  spec_id: arena_persistence_security_v1
  version: 1
  status: active
  owner: storage_security

persistence:
  database: sqlite
  mode: wal
  rules:
    - One serialized write owner publishes durable state.
    - Foreign keys are enabled.
    - Schema migrations are ordered, transactional, and recorded.
    - An upgrade creates and verifies a backup before migration.
    - Commands, state changes, events, and audit records commit atomically.
    - Low disk space blocks new scheduling before writes become unsafe.
  logs:
    raw: rotated_zstd_segments
    structured: sqlite
    rule: protocol_critical_messages_have_an_independent_bounded_channel
  retention:
    behavior: bounded_incremental_deletion
    active_game_protection: true
  report_artifacts:
    root: manager_data_root/reports/report_uuid
    filenames: fixed_by_allowlisted_format
    rules:
      - Render into a unique staging directory and atomically activate the complete immutable artifact set before committing the report resource.
      - Never accept a caller-provided output path, filename, media type, or extension.
      - Reject symlinks, non-regular files, missing files, and digest mismatches before an artifact is served.
      - A failed database commit removes the newly activated artifact directory; a dry-run creates no file.

secrets:
  storage: libsodium_encrypted_files
  windows_master_key: dpapi_machine_scope_plus_service_acl
  linux_master_key: service_owned_mode_0600
  api_behavior: write_only
  forbidden:
    - database_plaintext
    - argv
    - child_environment
    - logs
    - events
    - reports
    - exports

local_security:
  bind: loopback_only
  browser_session: one_time_pairing_to_http_only_same_site_strict_cookie
  browser_session_resume:
    authority: existing_unexpired_http_only_session_cookie
    behavior: same_origin_read_only_csrf_resynchronization
    rules:
      - A dashboard tab that inherits a valid session cookie but has no
        per-tab CSRF value may recover that existing session's CSRF value from
        the authenticated loopback origin.
      - Session resume never creates or extends a session, consumes a pairing
        token, accepts a bearer substitute, or weakens mutation origin and
        CSRF validation.
      - Same-origin policy, SameSite Strict cookies, and no-store responses
        prevent a cross-origin caller from reading the recovered value.
  cli_bearer_key:
    authority: manager_data_root_client_key_file
    platform_port: ClientKeyStore
    format:
      bytes: 65
      payload: 64_lowercase_hexadecimal_bytes_plus_one_lf
      extra_bytes: forbidden
    state_root:
      requirements:
        - The absolute normalized state root is admitted through a pinned
          platform directory handle. A linked, reparse, non-directory,
          substituted, overlong, or broadly writable root is rejected.
        - Creation is limited to one missing final directory below an admitted
          existing parent. Creation never follows a missing-path substitute.
        - A newly created final directory receives its restricted platform
          permissions before it becomes visible; inherited broad write
          authority is never admitted temporarily or repaired afterward.
        - The key is opened relative to the admitted root where the platform
          supports handle-relative access; otherwise the root is pinned
          against rename and the opened file is revalidated against it.
    admission:
      requirements:
        - Existing keys are opened without following the final link and must
          be a regular file whose owner/scope agrees with the admitted state
          root.
        - Reads consume at most 65 required bytes plus one overflow byte from
          the admitted handle. Pre-read, descriptor, and post-read identity,
          size, and mutation evidence must agree.
        - Linux keys allow only owner read/write and an optional owning-group
          read bit; group/other write and every execute bit are forbidden.
        - Windows keys require a non-null DACL and reject non-canonical allow
          entries or write, delete, owner, or ACL authority granted to any
          principal other than the admitted owner, LocalSystem, LocalService,
          or Administrators. Creation grants the current service identity,
          LocalSystem, and Administrators write authority and grants built-in
          users read authority only.
        - CLI proof and bearer requests use this same exact admission port;
          no client reads the pathname through an unbounded stream.
    publication:
      requirements:
        - First creation writes a random private exclusively-created staging
          file with final permissions in place before the first key byte.
        - The file is flushed, activated atomically without overwriting an
          independently published key, and followed by directory durability
          on platforms that support it.
        - Concurrent first creators admit the one winning published key.
          Predictable or stale staging files cannot block publication.
        - The published path is reopened and fully admitted before its key
          generation becomes in-memory authentication authority.
        - Partial write, flush, activation, reopen, or cleanup failure cannot
          publish or return the proposed key as authority.
    server_authentication: >
      Before transmitting the bearer key, every CLI or desktop pairing client
      must restrict the endpoint to an explicit numeric loopback HTTP origin
      and verify a fresh bounded challenge using a domain-separated keyed
      Manager proof derived from that same client key and bound to the service's
      own configured numeric loopback origin. The service derives the proof
      audience from its listener configuration rather than caller input, and
      the client requires that audience to equal its configured endpoint before
      transmitting bearer authority. A listening port, successful TCP
      connection, or relayable proof from another Manager port is not Manager
      identity.
    transport_bounds: >
      Client responses are byte-bounded before JSON interpretation. Redirects,
      DNS names, user information, paths in the configured origin, and
      non-loopback endpoints are rejected before credential use.
    rotation: >
      The service keeps one exactly admitted key generation in memory and
      reloads only through ClientKeyStore for server proof or after an
      in-memory bearer mismatch, so installer-preserved state, repair, and
      restore cannot strand the installed CLI or browser pairing flow on an
      obsolete key. Replacement, repair, and reload never use path-only
      prechecks, and rejected generations do not replace current authority.
    diagnostics: one_bounded_generic_unavailable_detail_without_key_or_path
  required:
    - origin_validation
    - csrf_protection
    - content_security_policy
    - bounded_request_body
    - rate_limits
    - schema_validation

recovery:
  - Reconstruct games from starting position and committed moves.
  - Relaunch local engines without charging service downtime.
  - Mark operations interrupted when their side effect cannot be proven.
  - Broker unavailability degrades only external OS service mutation.
