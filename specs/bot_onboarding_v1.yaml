schema: arena_bot_onboarding_v1
schema_version: 1
status: authoritative

purpose: >
  Define command-line-free installation, detection, account probing,
  configuration, and lifecycle projection for the Lichess BOT adapter.

profile:
  profile_id: lichess_bot
  adapter_component_id: lichess.adapter
  v1_cardinality: one_local_account
  authentication: token_file_reference

token_reference:
  ownership: permanent_operator_external_file
  selection_owner: authenticated_interactive_user_helper
  persistence_owner: installer_owned_locator_transaction
  input_modes:
    default: write_only_direct_token
    advanced: existing_external_file_locator
  rules:
    - Installers, packages, repositories, release artifacts, tests, and
      Manager state never contain a Lichess API credential.
    - Each local installation supplies its own external token file and may
      replace the saved path reference without modifying installed payloads.
    - The default dashboard control is a masked direct API-token field. Its
      value is sent only as one bounded application/octet-stream body to the
      authenticated native helper and is never encoded as JSON, a URL, argv,
      setup output, browser storage, or Manager service state.
    - The native helper atomically materializes the value in an
      access-restricted per-user operator-owned file outside Manager data and
      installed component roots. It then supplies only that path to the same
      Installer-owned locator transaction used by existing-file selection.
    - Direct replacement is rejected while provider startup is enabled. A
      failed locator commit restores the preceding file exactly and leaves no
      staged or backup credential file.
    - Existing token-file selection remains available behind an explicit
      advanced control and retains its metadata-only validation contract.
    - A token path under Manager-owned data or the verified provider component
      root is rejected; neither location may become credential storage.
    - Discovery exposes an external-token-path blocker before probe or startup
      when a legacy locator points into the verified provider component.
    - The dashboard can materialize, select, and replace the token-file
      reference without a terminal through the authenticated desktop helper
      and adjacent Installer-owned arena-setup.
    - The Manager service has no token-locator mutation endpoint. It reads only the
      validated saved-locator contract and projects redacted availability.
    - Installer validation uses filesystem metadata only and never opens, hashes, copies,
      logs, or returns token contents. Its import transaction regenerates and verifies
      every affected consumer configuration before committing the locator.
    - Setup mutation responses and Manager discovery output do not return the selected path.

discovery:
  sources:
    - verified_adapter_receipt
    - saved_lichess_token_locator
    - installer_generated_configuration
    - provider_startup_status
    - redacted_runtime_status
  rules:
    - Discovery never reads credentials, registers an account, or starts a process.
    - Missing or broken prerequisites remain explicit candidate blockers.
    - The adapter is compatible only when its immutable manifest and receipt
      bind an exact uci_arena_service_contract_v1 document, Manager operation
      catalog, configuration schemas, and status schema by path and SHA-256.
      Unknown majors, missing operations, identity drift, or tampering remain
      visible as an incompatible adapter and no provider process is invoked.

probe:
  owner: verified_provider_adapter_under_interactive_user_helper
  transport: authenticated_ephemeral_loopback_helper
  output_allowlist: [account_name, title, is_bot, game_count]
  rules:
    - The adapter alone may open the referenced token file.
    - The Manager service never launches the credential probe under its service identity.
    - The helper accepts no credential contents or arbitrary executable path and resolves
      only receipt-verified adapter/runtime entrypoints from the Manager data root.
    - A non-BOT account is rejected.
    - Probe output never includes token material, headers, URLs with credentials,
      raw provider responses, or the token-file path.

account_control:
  owner: verified_provider_adapter_under_interactive_user_helper
  transport: authenticated_ephemeral_loopback_helper
  startup_actions: [status, enable_startup, disable_startup]
  local_account_actions:
    - owner_list
    - owner_add
    - owner_remove
    - reservation_status
    - reservation_create
    - reservation_cancel
    - scheduler_status
    - scheduler_pause
    - scheduler_resume
  output_allowlist:
    - state
    - installed
    - active
    - account_name
    - owners
    - reservation
    - scheduler
    - provider_state
    - provider_ready
    - stream_connected
    - blockers
  rules:
    - Status and disable resolve only receipt-verified adapter and runtime
      entrypoints and never require or open the token file.
    - Enable requires every non-probe readiness dimension and performs a fresh
      BOT-only account probe before installing provider-owned per-user startup.
    - The account identity passed to startup comes only from that fresh probe;
      the dashboard cannot supply or override it.
    - Provider startup output is reduced to the output allowlist. Raw task,
      service, path, command, environment, provider response, and credential
      fields never reach the dashboard.
    - Local account actions resolve only the receipt-verified adapter and its
      receipt-owned runtime directory. Usernames, game counts, and reservation
      minutes are separately bounded; no browser-provided executable, command,
      path, argv array, shell string, store path, or runtime path is accepted.
    - Owner, reservation, opponent record, and scheduler pause state remain
      provider-owned durable data. Manager neither opens nor mirrors the
      provider database.
    - Helper shutdown removes account-control authority without stopping an
      already installed provider startup.
    - Manager obtains each fixed provider command prefix from the
      receipt-verified operation catalog and appends only operation-specific,
      separately bounded scalar arguments. Provider command verbs are not
      copied into Manager control flow.
    - A generic bot.register command is forbidden because it could create
      account state without the verified adapter probe.

options:
  schema: uci_arena_lichess_manager_options_v1
  groups:
    - capacity
    - inbound_challenges
    - outbound_challenge
    - scheduler
    - opponent_selection
  rules:
    - UI controls are schema-backed and never expose arbitrary configuration text.
    - Capacity cannot exceed the exact qualified capacity profile.
    - Rated or outbound play requires explicit operator confirmation.
    - Read and update operations run through the receipt-verified provider
      adapter with its installed local configuration path. Manager does not
      parse, edit, or replace provider-owned bot policy groups itself; discovery
      may inspect only the path-valued prerequisites needed for readiness.
    - The editable projection contains only the five declared groups. Engine,
      model, profile, URL, runtime, startup, token, and arbitrary UCI option
      fields are excluded.
    - A provider rejection leaves the prior configuration authoritative and is
      returned as an actionable error; React state cannot fabricate a save.

readiness:
  required:
    - verified_adapter
    - verified_uci_arena_engine
    - active_model
    - opening_book
    - syzygy
    - timing_profile
    - single_game_profile
    - capacity_profile
    - transport_profile
    - token_reference
    - bot_account_probe
  projection:
    prerequisite_states: [ready, missing]
    account_probe_states: [not_verified, verified]
    startup_states: [disabled, enabled]
    rules:
      - Every required dimension is returned independently; a generic blocked
        state cannot replace the per-dimension evidence.
      - ready_to_probe requires every prerequisite except bot_account_probe.
      - The interactive probe result may project bot_account_probe as verified
        for the current launcher session, but it does not enable startup.
      - Provider-reported helper status is the live startup authority for the
        current interactive session. Installer receipt state is only a startup
        hint and must not overwrite a newer helper observation.
      - Credential-free provider status is sampled with startup status and
        independently projects active, ready, stream connectivity, and bounded
        blockers. Startup registration alone never implies an active bot.
  rule: Missing readiness never appears as active.
  evidence_contract:
    current_capacity_schema: uci_arena_lichess_capacity_profile_v2
    current_transport_schema: uci_arena_lichess_transport_profile_v2
    rules:
      - Manager path hints prefer the current v2 capacity and transport
        filenames, while permissive discovery may retain older parseable
        evidence for review.
      - Manager never promotes, rewrites, or invalidates timing evidence from
        its filename or age. The verified Lichess provider remains authority
        for profile schema, qualification, compatibility, and effective use.

lifecycle:
  startup_owner: provider_per_user
  manager_actions: [status, enable_startup, disable_startup]
  explicit_user_actions:
    - select_or_replace_token_reference
    - verify_account
    - refresh_startup_status
    - enable_startup
    - disable_startup
    - manage_owners
    - manage_reservation
    - pause_or_resume_scheduler
    - edit_schema_backed_options
  duplicate_daemon: forbidden

acceptance:
  - A Complete Arena install shows the adapter as installed but disabled.
  - A direct token can be entered without reaching the Manager service and is
    materialized as a private external file before only its path is committed.
  - An existing token-file reference can be selected without Manager or installer reading it.
  - Failed direct materialization or locator commit leaves the prior credential
    and locator authoritative and leaves no staged or backup file.
  - Saving the reference through Bots and Configuration uses the same typed
    Installer import transaction; no Manager-only write path can bypass
    consumer-configuration regeneration or provider refresh.
  - The account probe discovers one BOT account and rejects a normal account.
  - Startup enablement performs a fresh probe and cannot accept an
    account name from the browser.
  - Startup status, enable, and disable remain available without a terminal
    while the authenticated desktop helper is running.
  - A stale installer receipt cannot make active provider startup appear
    disabled after helper status succeeds.
  - Every missing safety prerequisite is visible before startup.
  - No happy-path bot setup step requires a terminal command.
  - Automated HTTP integration uses a loopback fake Lichess API with a
    non-secret fixture token and never requires an operator credential.
  - A fake conforming provider with a different executable layout proves that
    startup, status, options, and account controls resolve the published
    operation catalog rather than hardcoded provider verbs or source paths.
