meta:
  spec_id: arena_product_contract_v1
  version: 1
  status: active
  owner: domain

manager_startup:
  core_readiness:
    schema: arena_manager_readiness_v1
    state: core_ready
    authority: authenticated_manager_service
  reconciliation:
    timing: asynchronous_after_core_readiness
    projections:
      - installed_service_reconciliation
      - installed_engine_reconciliation
    rules:
      - Slow, failed, absent, or incompatible external providers never prevent
        the Manager listener, authenticated desktop pairing, or core commands
        from becoming available.
      - Reconciliation state and bounded errors remain visible in system
        status and cannot become a second runtime authority.
      - Reconciliation uses the same receipt, provider-operation, UCI probe,
        revision, and persistence contracts as an explicit refresh.

resource_contract:
  required_fields:
    - id
    - host_id
    - revision
    - created_at
    - updated_at
    - labels
  host_id_v1: local
  ids: uuid_v7
  runtime_version:
    authority: configured_suite_build_version
    invariant: Manager status reports the version compiled into the running binary, never a source-level placeholder.

resources:
  - host
  - engine
  - bot
  - managed_service
  - health_probe
  - match
  - tournament
  - game
  - operation
  - report
  - artifact
  - secret_reference
  - log_source
  - health_snapshot

engine_contract:
  universal_fields:
    - display_name
    - executable
    - working_directory
    - argv
    - environment_references
    - uci_options
    - fingerprint
    - resource_limits
  startup_interrogation:
    - process_launch
    - uciok
    - readyok
    - typed_option_discovery
    - legal_startpos_bestmove
    - optional_typed_runtime_model_identity
  rule: >
    UCI Arena Engine, LC0, Stockfish, and every other registered UCI engine use
    this same resource and interrogation path. Engine names never dispatch code.
  runtime_model_identity:
    source: optional_generic_uci_info_signal
    fields: [model_fingerprint, provider, provider_numeric_fingerprint]
    rules:
      - The generic probe may retain a structurally valid runtime identity
        emitted during startup interrogation, including after advertised UCI
        options are applied and before the following readyok; absence keeps an
        engine fully usable.
      - An option-selected model deployment is evidence-eligible only when the
        engine republishes the effective typed identity after that selection;
        Manager never reuses a pre-selection identity for the new deployment.
      - A model name, engine name, executable stem, or component name never
        selects the parser or fabricates runtime identity.
      - A verified default_model.root is deployment metadata, not a model-name
        dispatch. Receipt onboarding resolves it beneath the immutable
        component root and supplies it only through an engine-advertised
        ModelRoot UCI option.
      - An explicit operator model selection may replace only the advertised
        ModelRoot value in a receipt-managed launch profile. The repeated
        probe must observe a post-selection runtime identity before Manager
        persists that identity; a model label never selects a path.
  installed_candidate_entrypoints:
    rules:
      - A verified managed-component receipt contributes an engine candidate
        only when its component manifest declares a `uci_engine` discovery
        role whose locator resolves to a digest-verified component file.
      - A discovery locator may name any declared entrypoint or an explicit
        component-relative path; the entrypoint key itself carries no role.
      - An entrypoint name, capability, component id, filename, model label,
        or enumeration order never implies that a component is a UCI engine.
  managed_launch_profile:
    schema: arena_uci_engine_launch_profile_v1
    component_capability: uci_engine_launch_profile_v1
    rules:
      - A component that declares the versioned launch-profile capability must
        select one profile through its current receipt's bounded preserved
        configuration path. Manager never interprets an unrelated component's
        generic configuration path as this contract. The profile must bind the
        exact verified component and UCI entrypoint before its scalar options
        can enter the universal registration probe.
      - Manager consumes the flat engine launch contract and does not parse or
        synthesize provider timing, search, model, opening-book, or tablebase
        semantics. Those remain owned by the producing engine component.
      - A consumer of schema version 1 validates and uses its required bounded
        fields while safely ignoring additive fields it does not understand.
        Additive metadata cannot make a compatible profile unavailable; an
        unknown schema or major version still fails closed.
      - The profile state and redacted timing-evidence availability are
        discovery metadata. Every option still must be advertised, applied,
        and followed by readyok plus a legal bestmove before registration. A
        qualified_timing profile additionally requires the capability-owned
        runtime_status response to match its model, adapter, provider,
        hardware/driver, runtime, search-core, and timing-contract identity;
        mismatch or absence fails the probe without persisting a resource.
      - A receipt-managed engine whose current candidate profile differs from
        its persisted registration exposes one explicit refresh operation.
        Refresh repeats the same full candidate and runtime-identity probe,
        updates that existing resource by revision, and is rejected while a
        running or paused competition or active game references the engine.
        A new immutable root or version for the same verified component id is
        such a refresh; it must not create a second managed Engine authority.
        Removing an idle Engine resource removes Manager registration state
        only and never deletes installed or preserved component data.
      - Manager startup automatically invokes that same revision-checked full
        refresh operation when exactly one persisted receipt-managed UCI Arena
        Engine still carries its packaged launch_profile authority and the
        verified current receipt candidate differs. The automatic path never
        bypasses active-use conflicts, UCI probing, runtime-identity checks, or
        optimistic revision control.
      - An operator-selected ModelRoot removes packaged launch_profile
        authority from the persisted registration. Startup reconciliation
        preserves that registration unchanged and reports
        operator_model_override_preserved; provider output or a new component
        root never silently resets the operator's model choice.
      - An absent, ambiguous, unverifiable, or busy managed Engine remains
        safely stale with a bounded reconciliation result. It cannot prevent
        Manager startup or create a second Engine authority.
      - An operator-selected ModelRoot keeps every other Engine-owned launch
        argument and UCI option exact, including timing reserves and forecast
        settings derived from selected Evidence. When that launch profile
        names a timing profile, Manager retains its identity as a reusable
        operational baseline instead of treating the timing distribution as
        absent or inactive. The selected model does not inherit the packaged
        model fingerprint or an exact claim for the model/search-specific
        marginal move-quality response to additional search time. A search-
        core change therefore makes that marginal calibration non-exact but
        does not by itself discard the operational distribution. A materially
        different model architecture, inference provider, or input/output
        contract can also change the distribution and warrants refreshed
        evidence. Returning to the packaged ModelRoot restores its exact
        runtime claims only after the normal full managed-candidate probe
        succeeds.
      - A reusable operational timing binding is Manager projection metadata,
        not a fabricated exact runtime match. It records the selected profile
        identity, operational_distribution `retained`, and
        marginal_move_quality `unqualified`; qualified_timing remains reserved
        for the Engine-published runtime identity that passes the exact probe.
  naming_boundary:
    product_engine_executable: uci_arena_engine
    requirements:
      - Model names identify model packages only.
      - Engine discovery, registration, display defaults, match planning, and
        installer logic must not identify an engine by a bundled model name.
      - The UCI Arena Engine candidate is recognized only by its neutral
        executable name or an explicit operator-selected path.
      - No legacy model-branded executable alias is accepted automatically.
      - UI examples use registered engine resources rather than hardcoded model
        families.
      - Automated test fixtures may use named model metadata to prove that
        provider-supplied labels are rendered as data. The exemption applies
        only to test files and never permits a model name to select a production
        path or implementation.
  preferred_product_engine:
    component_id: uci_arena.engine
    display_name: UCI Arena Engine
    requirements:
      - Verified component identity, never enumeration order or a model label,
        marks the recommended engine.
      - The bundled model is projected as separate model-package metadata.
      - Packaged default-model metadata remains discovery provenance when an
        operator selects another ModelRoot and is never presented as the
        effective selected model.
      - A successful registration copied from a verified installation receipt
        persists component_id, onboarding_source, recommended, and
        default_model as non-authoritative discovery provenance.
      - UCI option scalars are normalized to bounded string values at the
        registration boundary and that canonical map is reused for every
        tournament, Evidence, and bot-facing launch.
      - Tournament participant selectors distinguish duplicate display names
        with component version and stable resource identity while retaining
        the preferred-engine indicator.
      - A registration without component_id remains usable but cannot become
        preferred by matching its display name, reported engine name,
        executable stem, or persisted creation order.
      - Stockfish and every external UCI engine remain peers under the same
        registration and probing contract.

bot_contract:
  profile_id: lichess_bot
  v1_cardinality: one_local_account
  credential: token_file_secret_reference
  required_fields:
    - profile_id
    - display_name
    - adapter_component_id
    - account_name
    - engine_id
    - options
    - readiness
    - desired_state
    - observed_state
    - health
  invariants:
    - Every installation supplies an operator-owned token file outside the
      repository and installed immutable component roots. The authenticated
      native helper may materialize that file from a write-only direct entry,
      or the operator may select an existing external file.
    - Account identity comes from the verified adapter's BOT-only account probe.
    - Credential contents never enter Manager service state or APIs, logs,
      argv, receipts, setup results, browser storage, or provider configuration.
      The direct-entry value crosses only the authenticated interactive helper
      request body and is discarded after the external locator transaction.
    - Discovery, probing, and installation never register or start a bot.
    - Provider-owned per-user startup cannot be duplicated by Manager.
    - The bot account is a verified adapter projection, not a generic resource
      that can be created through bot.register.
    - Startup enablement is an explicit interactive-user action and repeats
      the BOT-only account probe before invoking the receipt-verified provider
      startup adapter.
    - Provider-owned owner, reservation, and scheduler state crosses Manager
      only through fixed typed adapter actions and bounded projections; Manager
      never opens the adapter store.
    - Provider-owned bot policy configuration crosses Manager only as
      uci_arena_lichess_manager_options_v1. Unknown fields and arbitrary raw
      configuration are forbidden.
    - A reserved opponent must be selected from the current provider-owned
      owner projection. The dashboard rejects an absent owner before invoking
      the adapter and refreshes provider state after every mutation.
    - Configuration mutation is atomically validated by the provider. Rated or
      newly enabled automatic outbound play requires separate explicit
      confirmation, and capacity cannot exceed qualified evidence.

local_match_planner:
  supported:
    - head_to_head
    - round_robin
    - gauntlet
    - swiss
    - sprt
  inputs:
    - engine_ids
    - engine_option_overrides
    - game_count_or_rounds
    - color_policy
    - opening_suite
    - time_control
    - concurrency
    - adjudication
    - seed
  invariants:
    - At least two distinct registered engines are required.
    - Engine-specific overrides do not mutate catalog defaults.
    - Plans are deterministic for the same normalized inputs and seed.
    - Every scheduled game records both engine fingerprints and options.
    - Before admitting the first game, Manager repeats the complete UCI probe
      for every distinct participant with that competition's effective option
      set and verifies the executable fingerprint still equals the registered
      identity. A persisted qualified managed profile also repeats its typed
      runtime-status identity comparison. Failure terminates the competition
      before creating a game.
    - Competition-specific option overrides must name options advertised by
      the registered engine and satisfy their declared type and bounds before
      the plan is persisted.
    - Color-paired formats schedule reversed colors together.
  opening_suite:
    schema: arena_opening_suite_v1
    maximum_bytes: 16777216
    fields:
      positions: [{starting_fen: string, variant: standard_or_chess960, uci_moves: [string]}]
    selection: deterministic_opening_index_modulo_position_count
  time_control:
    required: [initial_ms, increment_ms]
    optional: [moves_to_go]
  adjudication:
    fields:
      max_plies: {minimum: 2, maximum: 2048, default: 512}
      draw_cp: {minimum: 0, maximum: 1000, nullable: true}
      draw_consecutive_plies: {minimum: 1, maximum: 100, default: 8}
      draw_min_plies: {minimum: 0, maximum: 1000, default: 80}
      win_cp: {minimum: 1, maximum: 100000, nullable: true}
      win_consecutive_plies: {minimum: 1, maximum: 100, default: 6}
  sprt:
    required: [elo0, elo1, alpha, beta]
    bounds:
      elo: [-1000, 1000]
      alpha_beta_exclusive: [0, 0.5]
    rules:
      - elo1 must be greater than elo0.
      - The maximum game count is positive and even so reversed colors are
        admitted and evaluated as one pair.
      - The persisted result contains LLR, thresholds, games, score, and one
        immutable verdict: accept_h0, accept_h1, or inconclusive.

canonical_game:
  variants: [standard, chess960]
  authority: manager_chess_rules
  persisted:
    - starting_fen
    - variant
    - uci_moves
    - san_moves
    - per_ply_fen
    - clocks
    - result
    - termination
    - engine_identity
    - engine_options
    - evaluations
    - principal_variations
  invariants:
    - Engine output is advisory until parsed and legally applied.
    - A completed ply is committed before the next move request.
    - Restart reconstruction must match the last committed FEN.
    - Illegal moves and protocol failures have explicit termination values.
    - Chess960 uses a persisted deterministic starting FEN, UCI_Chess960=true,
      and Chess960-aware legality and castling parsing.
    - Opening-suite plies, engine centipawn or mate projections, and principal
      variations remain aligned with the canonical move list.
    - Live-game projections contain only running or interrupted game resources.
      History contains terminal game resources and reconstructs replay solely
      from persisted starting_fen and per_ply_fen snapshots; browser chess
      rules never invent a position.

tournament_contract:
  formats: [match, round_robin, gauntlet, swiss, sprt]
  lifecycle: [planned, queued, running, paused, completed, cancelled, failed]
  swiss: deterministic_score_groups_repeat_avoidance_color_balance_seeded_ties
  sprt: color_paired_elo_bounds_alpha_beta_immutable_verdict
  execution:
    actions: [start, pause, resume, cancel]
    progress_fields: [total_games, queued_games, active_games, completed_games, cancelled_games, failed_games, unplayed_games, percentage, current_round, updated_at]
    rules:
      - Start launches only persisted, registered engine identities and repeats
        UCI readiness before the first scheduled game.
      - Lifecycle and progress are persisted after every transition and game;
        dashboard state is a projection of Manager-owned resources and events.
      - Pause stops admission of new games and lets active games reach a safe
        move or game boundary. Resume continues the remaining deterministic
        schedule without replaying completed games.
      - Cancel stops admission, terminates active engine processes within the
        bounded cancellation deadline, and preserves completed game records.
      - Progress classifies every scheduled game exactly once as queued,
        active, completed, cancelled, failed, or unplayed. Unplayed means a
        schedule entry that will never be admitted because the competition is
        terminal; it is not a fabricated game resource.
      - Terminal competitions expose zero active and queued games. Their
        percentage reaches 100 only when every scheduled game has a durable
        terminal outcome or an explicit unplayed disposition.
      - Manager startup reconciles legacy terminal progress that predates the
        complete disposition fields. Reconciliation derives outcomes from
        durable game resources, creates no synthetic games, and is idempotent.
      - Optimistic revision conflicts are returned as the typed
        resource_revision_conflict command error. The dashboard may refresh
        and retry a lifecycle action at most three times while that action
        remains valid; runtime-authored progress churn must not turn Pause,
        Resume, or Cancel into an unactionable generic failure.
      - Every completed ply is legality-checked and durably represented in a
        game resource before the next move request.
      - A Manager restart marks interrupted active games explicitly and can
        resume only from the last committed canonical position.
      - Swiss rounds after the first are appended only after the previous round
        is durable. Pairing uses score groups, repeat avoidance where possible,
        color-balance minimization, deterministic seeded ties, and a
        non-repeating lowest-ranked bye when the field is odd.
      - SPRT admits complete reversed-color pairs, persists its likelihood
        ratio after each pair, stops admission at a decision boundary, and
        never rewrites a terminal verdict.
      - Opening-suite and Chess960 starting positions are validated and
        persisted before an engine process starts. Invalid input fails the
        competition without fabricating a game result.
      - Every competition surface exposes its stable resource id so plans with
        the same display name remain distinguishable.
      - A never-started planned competition may be explicitly removed through
        resource.remove with revision checking. Started or terminal
        competitions and their game records are retained as durable history.

managed_service_contract:
  identity: >
    A managed service is identified by a manager-owned UUID and a stable
    profile id. Repository names, paths, and implementation language are never
    identities.
  v1_cardinality: one_configured_resource_per_profile
  lifecycle:
    - not_installed
    - stopped
    - starting
    - running
    - paused
    - degraded
    - unavailable
    - stopping
    - failed
  evidence_orchestration:
    actions: [evidence_target_register, evidence_campaign_enqueue, evidence_job_cancel, evidence_job_retry]
    rules:
      - The Evidence Service remains orchestration authority; Manager invokes
        only component-declared typed API operations and stores bounded
        projections for the dashboard.
      - The built-in first campaign may target the active deployment or an
        existing service-issued target UUID. When exactly one provider-issued
        target exists, Manager binds the first campaign to that target instead
        of falling back to an unrelated active-model pointer. An explicit
        target id is accepted only when it is present in the current bounded
        provider projection. Arbitrary adapter execution is outside the
        Manager contract.
      - Evidence target registration accepts only a Manager-owned registered
        engine UUID. Manager repeats the generic UCI probe, combines its typed
        runtime identity with receipt-derived default-model metadata, and
        invokes the provider's declared target_register operation.
      - Browser input cannot provide target paths, fingerprints, providers,
        UCI options, commands, or argv. Evidence hashes and validates the
        resulting exact target and owns idempotent target identity.
  discovery:
    - executable_and_required_paths
    - declared_version_probe
    - capability_manifest
    - health_contract
  invariants:
    - Service commands use native argument arrays or a declared HTTP adapter.
    - A second registration for an already configured profile is rejected;
      operators reconfigure or remove the existing manual resource.
    - The manager never imports service source or opens a service-owned database.
    - Installed standalone services expose a digest-verified public contract
      whose identity, CLI entrypoint, capabilities, and data paths agree with
      the immutable component manifest.
    - Unknown future capabilities remain visible and are never assumed.
    - A not-yet-implemented service can be planned as unavailable without a fake executable.
    - Installation ownership remains with the service package unless an explicit installer capability is declared.

report_contract:
  action: report.generate
  target: {kind: report, id: null}
  formats: [html, pdf, csv, json, pgn]
  scopes: [current_state, competition]
  invariants:
    - Generation snapshots only Manager-owned public projections at one explicit data cutoff; it never opens provider storage or includes secret values.
    - A competition-scoped report accepts one existing match-plan or tournament UUID and includes only its persisted competition and game projections.
    - Every report resource is immutable and records filters, generation parameters, schema version, data cutoff, source-content hashes, provenance, and fixed-format artifact metadata.
    - A successful command renders every requested format before committing the report resource and durable event. Dry-run renders in memory and performs no filesystem or database write.
    - Artifact downloads resolve only the report UUID and one allowlisted format, verify the persisted digest, and require the same authenticated local session as other read APIs.

planned_lichess_incident_and_game_projection_2026_08_23:
  status: approved_plan_not_runtime_authoritative
  suite_record: https://github.com/iteathen/uci-arena-installer/issues/166
  owning_issues:
    incidents: https://github.com/iteathen/uci-arena-manager/issues/125
    games: https://github.com/iteathen/uci-arena-manager/issues/126
  activation:
    - This section records the approved product target but adds no current API
      route, OpenAPI authority, provider requirement, database record, or UI
      behavior.
    - Exact request and response schemas become authoritative only in the
      issue-owned runtime implementation PRs after the provider declares the
      compatible typed operations.
  read_only_routes:
    - GET /api/v1/providers/{profileId}/status
    - GET /api/v1/providers/{profileId}/incidents
    - GET /api/v1/providers/{profileId}/games
    - GET /api/v1/providers/{profileId}/games/{gameId}
  boundaries:
    - Manager resolves only operations declared by the exact receipt-verified
      provider service contract and component manifest.
    - Manager validates closed bounded project-owned schemas and never opens
      provider SQLite, runtime files, credential files, or NDJSON logs.
    - Provider status, incident, cooldown, game, replay, provenance, retention,
      and reconciliation facts remain provider authority.
    - Manager owns route authorization, compatibility reduction, pagination
      input bounds, read projection, and operator navigation.
    - Current status v3 providers remain compatible and project incidents and
      archive operations as unavailable instead of making the bot incompatible.
  incident_projection:
    cursor: stable_provider_owned_keyset
    rules:
      - Active critical and error incidents retain provider code, count,
        severity, active/resolved state, occurrence range, operation, and
        optional retry or game context after provider recovery.
      - Manager deduplicates by provider-issued identity and cursor. It never
        tails raw logs or interprets provider-private error text.
      - Rate-limit deadlines remain provider authority and no Manager action
        clears, shortens, or bypasses them.
  game_projection:
    provider_operations: [games_list, game_get]
    list_scopes: [live, history]
    maximum_page_size: 100
    maximum_replay_plies: 2048
    rules:
      - Manager-owned local games and provider-owned Lichess games share Live
        Games and Game History surfaces but retain distinct source authority.
      - Replay is enabled only for provider records declared archive-complete
        and uses provider-authored before/after FEN snapshots.
      - A summary_only record remains listable with incompleteness, exact
        available provenance, and an external Lichess link; Manager never
        fabricates positions, moves, clocks, or historical component versions.
      - Provider pagination uses stable keyset cursors and the generic bounded
        collection mechanism owned by Manager issue 106.
  non_goals:
    - manager_side_provider_persistence
    - provider_store_or_log_access
    - training_export_or_ccr
    - game_pruning

component_verification_registry_2026_08_23:
  status: runtime_authoritative
  owning_issue: https://github.com/iteathen/uci-arena-manager/issues/127
  purpose: >
    Preserve exact cryptographic component admission while removing repeated
    payload hashing from Overview and component HTTP request paths.
  lifecycle:
    startup: one_full_asynchronous_verification_per_manager_process
    process_local_states: [checking, verified, failed, stale]
    cache_authority: memory_only_for_current_process
    invalidation:
      exact_component_change: invalidate_affected_component
      filesystem_watcher_overflow: invalidate_all_components
  rules:
    - The /components request returns the current projection immediately and
      never hashes component payloads on the HTTP request thread.
    - Overview consumes the same registry projection and cannot initiate a
      second verification scan.
    - Invocation is blocked while a component is checking, stale, or failed.
      It resumes only after exact verification succeeds for the current bytes.
    - Manager restart discards all cached trust and begins a new asynchronous
      verification; persisted trust caches are forbidden.
    - Filesystem notifications are invalidation signals, not verification
      evidence. Overflow fails closed by invalidating all components.
    - Failure projection is bounded and excludes payload contents, paths,
      command lines, provider output, and credentials.
    - The registry is the only component receipt, manifest, and payload digest
      authority on Manager service runtime paths. Engine onboarding, installed
      service reconciliation, bot discovery, and component invocation consume
      its verified snapshots and cannot start an independent hash pass.
    - The public projection uses checking for both initial and invalidated
      verification work. The internal stale state fails closed immediately and
      remains visible through the bounded reason code
      component_verification_stale while revalidation is queued or running.
    - Native platform filesystem notifications cover the Manager receipt root
      and every admitted active component root. Receipt replacement invalidates
      the named component; payload change invalidates its owning component;
      watcher overflow invalidates all components.
  acceptance:
    - Overview renders while delayed verification of more than 100 MB reports
      checking, and repeated component requests perform no hashing.
    - Exact mutation or watcher overflow blocks invocation until revalidation.
    - The existing generic Overview operational summary remains owned by
      Manager issue 110; this registry supplies only component-attestation state.
