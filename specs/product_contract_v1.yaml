meta:
  spec_id: arena_product_contract_v1
  version: 1
  status: active
  owner: domain

resource_contract:
  required_fields:
    - id
    - host_id
    - revision
    - created_at
    - updated_at
    - labels
  host_id_v1: local
  ids: uuid_v7

resources:
  - host
  - engine
  - bot
  - managed_service
  - health_probe
  - match
  - tournament
  - game
  - operation
  - report
  - artifact
  - secret_reference
  - log_source
  - health_snapshot

engine_contract:
  universal_fields:
    - display_name
    - executable
    - working_directory
    - argv
    - environment_references
    - uci_options
    - fingerprint
    - resource_limits
  startup_interrogation:
    - process_launch
    - uciok
    - readyok
    - typed_option_discovery
    - legal_startpos_bestmove
  rule: >
    UCI Arena Engine, LC0, Stockfish, and every other registered UCI engine use
    this same resource and interrogation path. Engine names never dispatch code.
  naming_boundary:
    product_engine_executable: uci_arena_engine
    requirements:
      - Model names identify model packages only.
      - Engine discovery, registration, display defaults, match planning, and
        installer logic must not identify an engine by a bundled model name.
      - The UCI Arena Engine candidate is recognized only by its neutral
        executable name or an explicit operator-selected path.
      - No legacy model-branded executable alias is accepted automatically.
      - UI examples use registered engine resources rather than hardcoded model
        families.
  preferred_product_engine:
    component_id: uci_arena.engine
    display_name: UCI Arena Engine
    requirements:
      - Verified component identity, never enumeration order or a model label,
        marks the recommended engine.
      - The bundled model is projected as separate model-package metadata.
      - A successful registration copied from a verified installation receipt
        persists component_id, onboarding_source, recommended, and
        default_model as non-authoritative discovery provenance.
      - A registration without component_id remains usable but cannot become
        preferred by matching its display name, reported engine name,
        executable stem, or persisted creation order.
      - Stockfish and every external UCI engine remain peers under the same
        registration and probing contract.

bot_contract:
  profile_id: lichess_bot
  v1_cardinality: one_local_account
  credential: token_file_secret_reference
  required_fields:
    - profile_id
    - display_name
    - adapter_component_id
    - account_name
    - engine_id
    - options
    - readiness
    - desired_state
    - observed_state
    - health
  invariants:
    - Every installation supplies an operator-owned token file outside the
      repository and installed immutable component roots.
    - Account identity comes from the verified adapter's BOT-only account probe.
    - Credential contents never enter Manager state, APIs, logs, argv, or receipts.
    - Discovery, probing, and installation never register or start a bot.
    - Provider-owned per-user startup cannot be duplicated by Manager.
    - The bot account is a verified adapter projection, not a generic resource
      that can be created through bot.register.
    - Startup enablement is an explicit interactive-user action and repeats
      the BOT-only account probe before invoking the receipt-verified provider
      startup adapter.
    - Provider-owned owner, reservation, and scheduler state crosses Manager
      only through fixed typed adapter actions and bounded projections; Manager
      never opens the adapter store.
    - Provider-owned bot policy configuration crosses Manager only as
      uci_arena_lichess_manager_options_v1. Unknown fields and arbitrary raw
      configuration are forbidden.
    - Configuration mutation is atomically validated by the provider. Rated or
      newly enabled automatic outbound play requires separate explicit
      confirmation, and capacity cannot exceed qualified evidence.

local_match_planner:
  supported:
    - head_to_head
    - round_robin
    - gauntlet
    - swiss
    - sprt
  inputs:
    - engine_ids
    - engine_option_overrides
    - game_count_or_rounds
    - color_policy
    - opening_suite
    - time_control
    - concurrency
    - adjudication
    - seed
  invariants:
    - At least two distinct registered engines are required.
    - Engine-specific overrides do not mutate catalog defaults.
    - Plans are deterministic for the same normalized inputs and seed.
    - Every scheduled game records both engine fingerprints and options.
    - Color-paired formats schedule reversed colors together.
  opening_suite:
    schema: arena_opening_suite_v1
    maximum_bytes: 16777216
    fields:
      positions: [{starting_fen: string, variant: standard_or_chess960, uci_moves: [string]}]
    selection: deterministic_opening_index_modulo_position_count
  time_control:
    required: [initial_ms, increment_ms]
    optional: [moves_to_go]
  adjudication:
    fields:
      max_plies: {minimum: 2, maximum: 2048, default: 512}
      draw_cp: {minimum: 0, maximum: 1000, nullable: true}
      draw_consecutive_plies: {minimum: 1, maximum: 100, default: 8}
      draw_min_plies: {minimum: 0, maximum: 1000, default: 80}
      win_cp: {minimum: 1, maximum: 100000, nullable: true}
      win_consecutive_plies: {minimum: 1, maximum: 100, default: 6}
  sprt:
    required: [elo0, elo1, alpha, beta]
    bounds:
      elo: [-1000, 1000]
      alpha_beta_exclusive: [0, 0.5]
    rules:
      - elo1 must be greater than elo0.
      - The maximum game count is positive and even so reversed colors are
        admitted and evaluated as one pair.
      - The persisted result contains LLR, thresholds, games, score, and one
        immutable verdict: accept_h0, accept_h1, or inconclusive.

canonical_game:
  variants: [standard, chess960]
  authority: manager_chess_rules
  persisted:
    - starting_fen
    - variant
    - uci_moves
    - san_moves
    - per_ply_fen
    - clocks
    - result
    - termination
    - engine_identity
    - engine_options
    - evaluations
    - principal_variations
  invariants:
    - Engine output is advisory until parsed and legally applied.
    - A completed ply is committed before the next move request.
    - Restart reconstruction must match the last committed FEN.
    - Illegal moves and protocol failures have explicit termination values.
    - Chess960 uses a persisted deterministic starting FEN, UCI_Chess960=true,
      and Chess960-aware legality and castling parsing.
    - Opening-suite plies, engine centipawn or mate projections, and principal
      variations remain aligned with the canonical move list.

tournament_contract:
  formats: [match, round_robin, gauntlet, swiss, sprt]
  lifecycle: [planned, queued, running, paused, completed, cancelled, failed]
  swiss: deterministic_score_groups_repeat_avoidance_color_balance_seeded_ties
  sprt: color_paired_elo_bounds_alpha_beta_immutable_verdict
  execution:
    actions: [start, pause, resume, cancel]
    progress_fields: [total_games, queued_games, active_games, completed_games, percentage, current_round, updated_at]
    rules:
      - Start launches only persisted, registered engine identities and repeats
        UCI readiness before the first scheduled game.
      - Lifecycle and progress are persisted after every transition and game;
        dashboard state is a projection of Manager-owned resources and events.
      - Pause stops admission of new games and lets active games reach a safe
        move or game boundary. Resume continues the remaining deterministic
        schedule without replaying completed games.
      - Cancel stops admission, terminates active engine processes within the
        bounded cancellation deadline, and preserves completed game records.
      - Every completed ply is legality-checked and durably represented in a
        game resource before the next move request.
      - A Manager restart marks interrupted active games explicitly and can
        resume only from the last committed canonical position.
      - Swiss rounds after the first are appended only after the previous round
        is durable. Pairing uses score groups, repeat avoidance where possible,
        color-balance minimization, deterministic seeded ties, and a
        non-repeating lowest-ranked bye when the field is odd.
      - SPRT admits complete reversed-color pairs, persists its likelihood
        ratio after each pair, stops admission at a decision boundary, and
        never rewrites a terminal verdict.
      - Opening-suite and Chess960 starting positions are validated and
        persisted before an engine process starts. Invalid input fails the
        competition without fabricating a game result.

managed_service_contract:
  identity: >
    A managed service is identified by a manager-owned UUID and a stable
    profile id. Repository names, paths, and implementation language are never
    identities.
  v1_cardinality: one_configured_resource_per_profile
  lifecycle:
    - not_installed
    - stopped
    - starting
    - running
    - paused
    - degraded
    - unavailable
    - stopping
    - failed
  evidence_orchestration:
    actions: [evidence_campaign_enqueue, evidence_job_cancel, evidence_job_retry]
    rules:
      - The Evidence Service remains orchestration authority; Manager invokes
        only component-declared typed API operations and stores bounded
        projections for the dashboard.
      - The built-in first campaign may target the active deployment or an
        existing service-issued target UUID. Arbitrary adapter execution is
        outside the Manager contract.
  discovery:
    - executable_and_required_paths
    - declared_version_probe
    - capability_manifest
    - health_contract
  invariants:
    - Service commands use native argument arrays or a declared HTTP adapter.
    - A second registration for an already configured profile is rejected;
      operators reconfigure or remove the existing manual resource.
    - The manager never imports service source or opens a service-owned database.
    - Installed standalone services expose a digest-verified public contract
      whose identity, CLI entrypoint, capabilities, and data paths agree with
      the immutable component manifest.
    - Unknown future capabilities remain visible and are never assumed.
    - A not-yet-implemented service can be planned as unavailable without a fake executable.
    - Installation ownership remains with the service package unless an explicit installer capability is declared.
