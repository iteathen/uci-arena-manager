meta:
  spec_id: arena_operator_experience_v1
  version: 1
  status: active
  owner: operator_surface

navigation:
  - overview
  - services
  - bots
  - engines
  - local_match_planner
  - live_games
  - tournaments
  - game_history
  - logs
  - statistics_health
  - reports
  - configuration
  - audit

requirements:
  - desktop_first_responsive
  - complete_tablet_support
  - safe_mobile_monitoring
  - light_and_dark_themes
  - keyboard_navigation
  - reduced_motion
  - visible_focus
  - wcag_2_1_aa_contrast
  - virtualized_logs_and_tables
  - server_side_filtering
  - websocket_batching
  - stale_data_indicators
  - service_profile_setup_for_book_forge
  - optional_external_service_integrations
  - auto_discovery_with_manual_locator_fallback
  - model_neutral_engine_identity
  - command_line_free_normal_startup
  - truthful_install_configuration_runtime_states
  - installed_cli_on_path_with_offline_help
  - truthful_initial_loading_states
  - actionable_cross_page_references

interaction_feedback:
  requirements:
    - Initial API loading is presented as checking or loading and never flashes
      zero resources, an unavailable control plane, or an unconfigured service
      before the first request has completed.
    - Auto-detect and refresh actions expose in-progress state followed by a
      visible result summary or actionable error, including when discovery
      found no new candidates.
    - References to a missing prerequisite, setting, service, engine, report,
      plan, or control are links or buttons that navigate directly to the
      owning surface. Explanatory text is not a substitute for navigation.
    - Resource identities shown by Logs and Audit link to the owning engines,
      services, bots, competitions, game history, reports, configuration, or
      health surface using the shared resource-kind mapping.
    - The page hash is a durable deep link. Direct hash navigation, browser
      back/forward, and a newly delivered pairing hash update the rendered
      surface without reauthenticating ordinary page changes.
    - A direct same-origin tab that inherits a valid HttpOnly session cookie
      resynchronizes the existing session's per-tab CSRF value before it is
      presented as mutation-ready. Read success with a missing CSRF value must
      not produce an apparently authenticated UI whose controls all fail.
    - The durable-event resource filter enumerates every public resource kind
      defined by the shared domain contract; it must not silently hide game,
      report, artifact, health, operation, host, secret-reference, or log-source
      events behind an incomplete hard-coded subset.
    - Configuration reports the actual authenticated page host and port as the
      listen endpoint; a default production port is never hard-coded into a
      dashboard connected to a different local service instance.

engine_identity_experience:
  requirements:
    - Present UCI Arena Engine as an engine product, independently of its
      selected model package.
    - Do not use model names as engine cards, discovery hints, planner examples,
      or status labels.
    - Show the model package as separate metadata only when reported by the
      registered engine.
    - Put the receipt-verified uci_arena.engine candidate first and offer one
      explicit Use this engine action; that action performs the complete
      bounded UCI interrogation before creating the registration and does not
      require a redundant probe-confirm-register sequence.
    - Auto-detect searches only receipts, saved locators, provider manifests,
      PATH, and bounded standard roots. Scan folder uses the native picker and
      inspects only the selected root and direct children.
    - Persist the verified component id, candidate source, recommendation flag,
      and separate default-model metadata on a registered candidate so planner
      ordering never depends on enumeration order or a model-branded label.
    - Show whether a managed candidate's Engine-owned launch profile is using
      selected qualified timing evidence or conservative defaults. Selection
      is not described as active until the runtime-identity probe succeeds; a
      successful generic executable probe must not conceal missing timing
      integration.
    - Preserved registrations lacking verified component identity remain
      available as external peers but are never selected as the preferred
      product engine.
    - When the retained catalog offers a missing UCI Arena Engine, the native
      desktop view offers a reviewed Download and install action; an external
      browser never claims that a copied command performed installation.
      This preferred-engine callout remains visible when unrelated external
      candidates are discovered. If retained verified media is unavailable,
      show a Suite Setup repair action instead of an install control that will
      inevitably fail.

managed_service_experience:
  catalog_cards:
    - profile_id: book_forge
      state: available_when_configured
      callout: Existing external service
    - profile_id: uci_arena_evidence
      state: available_when_configured
      callout: Existing optional external service
  setup:
    - Label Book Forge and UCI Arena Evidence Service as optional.
    - Offer Auto-detect without registering or enabling a discovered candidate.
    - When discovery is incomplete or empty, keep manual paths and endpoint fields visible and editable.
    - Permit the operator to reconfigure a previously saved locator.
    - Reconfiguration applies to Manager-owned manual locators. A receipt-owned
      locator is shown read-only and directs changes to Suite Setup Modify;
      the dashboard never offers a save that the active provider lifecycle or
      installer ownership contract must reject.
    - Reject a second saved locator for the same profile. When upgrading a
      legacy database that already contains duplicates, select the exact
      receipt-owned instance for the catalog card, warn about the duplicate,
      and keep every instance visible until explicit cleanup.
    - Offer an audited Remove locator action only for an inactive manual
      instance. A running, starting, or paused instance must be stopped first;
      a receipt-owned instance directs the operator to Suite Setup Modify.
    - Show every required path or endpoint before validation.
    - Preview capabilities and ownership boundaries.
    - Never request external-service secrets that are not manager-owned.
    - Explain unavailable actions without presenting them as failures.
    - For provider-owned per-user startup registrations, show Probe plus
      Pause/Resume controls and a startup-owned status hint; do not show
      process Start, Stop, or Restart controls that would create a duplicate
      daemon.
    - Render Pause only for an observed active or degraded provider and Resume
      only for an observed paused provider. Unknown, stopped, failed, or
      unavailable provider state keeps Probe available without presenting an
      already-invalid lifecycle action.
    - Do not show an unconfigured optional service as an unhealthy manager resource.
    - Show Installed/Missing, Configured/Not configured, and current runtime
      activity as separate states on the catalog card.
    - While package inventory or saved instances are loading, show Checking
      for that independent dimension and never flash Missing, Not configured,
      or an inactive runtime conclusion from absent query data.
    - When a signed component is missing, offer a reviewed foreground
      download/install plan without granting package authority to the service.
      If retained verified media is unavailable, identify Suite Setup repair as
      the prerequisite rather than launching a known-failing setup plan.
  runtime_and_outputs:
    - Show desired state, provider-observed activity, health, and the last
      successful status sample as separate values.
    - Show Book Forge integration and qualified snapshot identities from the
      bounded Manager output projection without opening Book Forge storage.
    - Show Evidence dataset and qualified timing-profile identities from the
      bounded Manager output projection without opening Evidence storage.
    - Each Book Forge snapshot and qualified timing profile offers an explicit
      Use in Engine action in the authenticated desktop host. The action first
      previews and commits the Installer-owned import transaction, then repeats
      the managed Engine probe and reports whether the existing registration
      was refreshed or remains safely stale.
    - An external browser may inspect output identity but cannot claim to
      activate it. Provider publication never silently changes a registered
      Engine, a running game, or a running/paused competition.
    - Reports and configuration surfaces consume only these projected public
      outputs and visibly distinguish unavailable, incompatible, empty, and
      ready output sets.
    - Every configure, control, import, install, and output-selection mutation
      emits a durable audit record or returns an explicit failure; successful
      UI state must not exist only in transient React state.

local_path_picker:
  owner: interactive_desktop_host
  transport:
    native_desktop: token_scoped_loopback_helper_inside_native_host_lifetime
    external_browser: token_scoped_loopback_http
  lifetime: foreground_desktop_or_arena_ui_process
  requirements:
    - The Manager service never opens a desktop dialog or impersonates the interactive user.
    - The installed desktop host owns the normal file and directory picker
      path through the existing narrow typed interactive-user helper. The
      helper accepts only picker mode, display text, and extension filters and
      never arbitrary filesystem, process, argv, or shell requests.
    - `arena ui` starts the picker only on loopback and puts an unguessable
      per-process bearer token in browser session storage during pairing when
      the operator explicitly chooses the external-browser surface.
    - Picker requests declare file or directory mode plus display-only hints
      and extension filters; they never supply a command, executable, or shell string.
    - Windows uses the native common item dialog in the logged-in session.
    - Linux uses an installed desktop portal-compatible picker helper and
      returns actionable manual-entry guidance when no helper is available.
    - A selected path is returned to the dashboard but is not registered,
      enabled, copied, hashed, or opened until the operator explicitly submits
      the owning validation or import action.
    - Closing `arena ui` removes picker authority without invalidating the
      already-paired Manager dashboard session.
    - Native helper scratch state uses a unique directory beneath the
      interactive user's temporary directory, is removed when the helper
      exits, and never writes beneath the immutable install root or caller
      working directory.

desktop_launcher:
  executable: uci-arena-manager
  behavior:
    - Runs without a console window.
    - The shell identifies the connection as an authenticated local session
      and never labels it administrator, elevated, or privileged unless that
      exact authority is supplied by a typed backend contract.
    - Verifies the local service with a fresh keyed challenge bound to the
      service's own configured loopback origin before sending bearer
      authority, obtains a one-use pairing URL, and hosts the packaged
      React dashboard inside a thin native desktop window.
    - The Manager service remains the sole runtime and persistence authority;
      the native host owns only window lifecycle, pairing, native dialogs, and
      typed setup handoff.
    - Normal startup does not open the default browser and does not require a
      terminal. `arena ui` remains the explicit optional external-browser
      monitoring and troubleshooting surface.
    - Installs product-neutral application, installer, shortcut, window, and
      browser icons.
    - A second invocation activates the existing per-user native window
      instead of opening a duplicate host or browser tab.
    - The native host allocates its own loopback helper port so an optional
      concurrent `arena ui` browser session cannot disable native picker or
      typed setup authority through a fixed-port collision.
    - Navigation failures, missing WebView runtime support, unavailable
      Manager service, and pairing failures produce an actionable native error
      without silently falling back to an unauthenticated browser.
    - A running dashboard reprocesses a newly delivered pairing hash without a
      full page reload, so activating or reopening the desktop launcher can
      recover an expired session in an existing native view.
    - An unpaired dashboard directs normal users to reopen the installed
      desktop application. Terminal-based `arena ui` guidance is secondary and
      limited to the explicitly optional external-browser workflow.
  setup_helper:
    - Accepts only typed inventory, plan, and apply requests for catalog component ids.
    - Uses only the adjacent verified arena-setup, retained signed catalog, and fixed roots.
    - Rejects executable, argv, shell, and caller-selected catalog fields.
    - Shows dependencies, bytes, disk impact, elevation, and restart before confirmation.

cli_experience:
  executable: arena
  requirements:
    - Windows setup adds the installed bin directory to the user PATH for the
      recommended per-user package or the machine PATH for the explicitly
      elevated per-machine package, and removes only its own scoped entry on uninstall.
    - The recommended per-user package labels install, Modify, repair, update,
      and uninstall as non-elevated operations and launches Manager under the
      interactive account. The per-machine package labels UAC as required
      before the operator commits to it.
    - Linux packages install arena in the normal executable path and install
      arena(1) under the platform man hierarchy.
    - arena --help, every command help surface, the man page, and README use
      the same names for --endpoint, --data-dir, --output, and common commands.
    - Help documents that global flags precede the subcommand and includes
      status, health, doctor, ui, engine, service, and setup examples.

bot_experience:
  profile: lichess_bot
  requirements:
    - Replace the generic bot table with install, detection, account probe,
      readiness, options, and lifecycle views.
    - When the retained catalog offers a missing adapter, offer a reviewed
      native Download and install action that resolves its declared
      dependencies before token-file onboarding.
      If the adapter is missing but retained media is unavailable, keep an
      explicit Suite Setup repair prerequisite visible.
    - Present a masked direct Lichess API-key field as the normal credential
      setup path. Keep selection of an existing token file behind an explicit
      advanced control rather than showing both paths at once.
    - Direct entry is available only through the authenticated native desktop
      helper. It creates or atomically replaces one access-restricted per-user
      operator-owned token file outside Manager data and installed roots, then
      commits only its path through the same Installer-owned import transaction.
      Provider startup must be disabled before replacement.
    - Use an operator-owned token-file path permanently. Local installations
      provide their own credential; repositories, packages, tests, setup
      results, browser storage, Manager service APIs, and Manager state never
      contain one. Normal uninstall preserves the external file and purge has
      no authority to remove it.
    - Saving or replacing the token-file reference uses the same reviewed
      Installer-owned import plan and commit from both Bots and Configuration.
      The Manager HTTP API remains read-only for saved locators and cannot
      report success before consumer configuration regeneration commits.
    - Detect and reject non-BOT accounts through the verified adapter.
    - Default engine selection to the verified uci_arena.engine component and
      show its model package separately.
    - Show every engine, knowledge, evidence, capacity, transport, credential,
      and startup blocker without claiming the bot is active.
    - Show absent learned transport evidence as a visible provider bootstrap
      reserve rather than a blocker or a qualified profile. Account verification
      remains available before engine qualification, while startup remains
      gated by the separately projected live-play prerequisites.
    - Show provider-owned startup as disabled, enabled, active, or unavailable
      from the authenticated interactive-user helper; do not infer live state
      from catalog availability or a stale installer receipt.
    - Offer typed Refresh status, Enable startup, and Disable startup controls
      without a terminal. Enablement performs a fresh BOT probe and never lets
      the browser provide the account identity.
    - Offer Requalify installed engine whenever the verified adapter is
      installed and provider startup is disabled. The control invokes one fixed
      provider-owned workflow, displays a long-running state, and refreshes
      readiness only after both validated profile locators commit through
      Installer. It accepts no browser-supplied paths or commands.
    - Qualification success names the retained timing identity, current model,
      provider, search core, and concurrency without exposing filesystem paths.
      Failure remains actionable, leaves startup disabled, and links the
      operator to Engines, Reports, and Services for owning prerequisites.
    - While the installed adapter's Bots surface is open, sample the same
      credential-free provider/startup status on a bounded five-second interval.
      Manual Refresh remains available; polling never reads the token or contacts
      Lichess and never converts missing query data into an inactive conclusion.
    - Explain that closing the desktop helper removes account-control
      authority but does not stop provider-owned startup.
    - Every readiness blocker links to the owning Engines, Services, Reports,
      or Configuration surface and names the next safe action.
    - Replace raw bot-options JSON with labeled schema-backed controls for
      capacity, inbound challenges, outbound challenge, scheduler, and
      opponent selection. Loading, saved, rejected, and helper-unavailable
      states remain explicit.
    - Show the qualified capacity ceiling beside configured slots and prevent
      an unsupported capacity value before save when evidence is available.
    - Rated play and transition from disabled to automatic outbound play use
      distinct confirmation controls that name the behavioral consequence.
    - Provide owner add/remove/list, reservation create/status/cancel, and
      scheduler status/pause/resume without a terminal. Each action refreshes
      provider-authoritative state after success.
    - Reservation creation selects one of the current provider-owned owners;
      free-form non-owner submission is unavailable and an empty owner list
      links the operator to the owner control.
    - Account and option controls require the desktop helper but never require
      the Lichess token, never expose raw adapter configuration, and never
      imply that local owners are authenticated bot identities.

tournament_experience:
  requirements:
    - Saved plans are listed with format, participants, scheduled games, state,
      and direct actions; a count-only summary is forbidden.
    - Round robin, gauntlet, Swiss, and SPRT plans are persisted as tournament
      resources. Head-to-head plans may remain match-plan resources.
    - Planned resources expose Start; running resources expose Pause and
      Cancel; paused resources expose Resume and Cancel; terminal resources do
      not expose invalid lifecycle actions.
    - Progress shows completed, active, queued, and total games, a percentage,
      the current round or game when available, and the last durable update.
      Cancelled, failed, and unplayed counts are shown when nonzero so a
      terminal competition never presents abandoned work as still queued.
    - Start, pause, resume, and cancel use backend-authoritative commands and
      durable events. React state never fabricates lifecycle or progress.
    - If a lifecycle command collides with a concurrent backend progress
      revision, the dashboard refreshes the exact resource and retries at most
      three times. It retries only the same still-valid action, reports a
      typed final conflict visibly, and never applies this behavior to plan
      removal.
    - Empty tournament and match views link directly to the planner.
    - The planner exposes rounds for Swiss, the even maximum game count plus
      Elo hypotheses and alpha/beta for SPRT, moves-to-go, opening-suite path,
      maximum-ply and optional draw/win adjudication controls, and all supported
      variants. The opening-suite path supports the native file picker when the
      desktop helper is present while retaining manual entry. Controls hidden
      by format are omitted from the command.
    - The schedule preview labels Swiss capacity as games per round, never as color pairs. Other formats report complete color-reversed sets and disclose any odd unpaired game instead of rounding it into a fictitious pair.
    - Competition cards show a terminal SPRT verdict and likelihood ratio,
      Swiss round/bye progress, and direct links to the planner, Engines, and
      Reports wherever those references are named.
    - Competition cards expose a stable short resource id and creation time so
      duplicate display names are distinguishable. A planned competition may
      be removed only after explicit confirmation; started and terminal
      records remain durable history.
    - Live games show only running or interrupted resources with current
      backend-authored position, clocks, evaluation, principal variation, and
      owning-competition identity. Game history shows only terminal resources
      and provides ply-by-ply replay from persisted FEN snapshots.

evidence_service_experience:
  requirements:
    - The Services surface shows collection readiness, target count, job state
      counts, individual safe job summaries, datasets, and qualified timing
      profiles from provider-authoritative projections.
    - A configured compatible Evidence Service exposes one guided action to
      enqueue its built-in first campaign against the provider-owned default;
      retained historical targets never silently replace the active deployment.
      An absent exact target explains how to start or register a compatible
      model deployment before collecting.
    - When no target exists, the Services surface offers one guided Use
      preferred engine action if a receipt-verified UCI Arena Engine with
      default-model metadata is registered. The action repeats the full UCI
      probe, registers the exact deployment through the typed provider API,
      refreshes provider state, and requires no path, fingerprint, provider,
      JSON, or command-line entry from the operator.
    - If no eligible registered engine exists, the missing-target guidance
      links directly to Engines and names engine registration as the next step;
      Engines is never a dead-end prerequisite reference.
    - The first-campaign action is disabled while provider state explicitly
      reports waiting for a target and no provider-issued target is present;
      the UI does not invite a command that is already known to be invalid.
    - The first-campaign action is also disabled after any campaign job exists.
      Subsequent work uses provider-owned job controls or a future explicitly
      specified campaign surface; the bootstrap control cannot duplicate a
      campaign accidentally.
    - Eligible failed or cancelled jobs expose Retry; queued or waiting jobs
      expose Cancel. Invalid provider lifecycle actions are not rendered.
    - Reports bound long provider dataset projections inside a scrollable
      region so retained evidence cannot make the rest of the control plane
      unreachable. Missing-provider and selected-profile guidance links
      directly to Services or Configuration instead of naming a dead-end
      prerequisite.
    - All campaign and job controls call the typed service API through Manager,
      report success or failure visibly, and never fabricate progress in React.

knowledge_asset_setup:
  location: configuration
  requirements:
    - Offer one Auto-detect retained assets action for opening books, Syzygy
      tables, timing evidence, and Lichess single-game, capacity, and transport
      profiles. The native host delegates this read-only operation to the
      adjacent Installer-owned arena-setup binary; Manager does not duplicate
      file-index, content-inspection, or package-discovery mechanism.
    - Auto-detect uses the operating-system file index with a bounded result
      count and time budget. It never starts a recursive whole-volume walk,
      never writes a locator, and never enables a discovered asset.
    - Show index adapter, completion state, truncation, candidate provenance,
      and validation classification. An unavailable, stale, timed-out, empty,
      or partially populated index is a visible non-blocking result and keeps
      every manual browse and signed-download alternative available.
    - Offer a folder-assisted bounded fallback when useful assets are outside
      the operating-system index. The interactive helper forwards only the
      explicitly selected absolute roots, with at most eight roots per request,
      as repeated typed scan-root arguments; the
      Installer inspects the selected root and its direct children without a
      recursive drive crawl or mutation.
    - Discovery is deliberately permissive: partial Syzygy WDL or DTZ sets,
      standalone or sidecar-backed opening books, and parseable legacy,
      incomplete, or runtime-mismatched timing evidence remain catalogued.
      Exact qualification and identity are checked only when the operator asks
      to apply an asset to a runtime or make a protected-live safety claim.
    - Every discovered path has an explicit Review import action. The selected
      candidate and all retained alternatives remain visible with provenance
      and classification. Discovery itself never implies compatibility,
      installation, selection, or trust.
    - Offer browse-assisted opening-book, Syzygy directory, and Lichess
      token-file-reference selection with format-specific hints and filters.
    - Offer browse-assisted qualified timing, Lichess single-game, Lichess
      capacity, and Lichess transport profile selection with schema-specific
      filenames, identity guidance, and filters.
    - Explain that importing a Lichess single-game profile creates a bounded
      immutable managed copy of the profile and its hash-verified evidence
      closure; timing, capacity, transport, and Syzygy assets remain in place.
    - In the authenticated desktop host, offer reviewed typed arena-setup plans
      for importing selected existing paths and installing the exact signed
      missing-book or bounded tablebase components. Show components, bytes,
      disk impact, elevation, and service restarts before confirmation.
    - In the optional external-browser surface, offer the equivalent copyable
      arena-setup commands because a browser session has no installer authority.
    - Generated commands place global arena-setup options before the selected
      subcommand so the copied command is directly executable.
    - The Manager service never executes arena-setup package operations or
      acquires package-install authority. The native desktop host may invoke
      only the adjacent verified arena-setup through the typed setup helper;
      the React view cannot provide an executable, argv array, shell string,
      catalog path, or install root.
    - Buttons distinguish Download and install, Import existing, and Copy
      command. A control must not claim to download or install when it only
      copies a command.
    - Lichess token contents are never read, previewed, copied, or placed in
      the generated command; only the selected path is present.

local_development_launcher:
  entrypoint: run-local.cmd
  requirements:
    - Resolve binaries, web assets, data, logs, and helper scripts from the repository root rather than the caller working directory.
    - Reuse a healthy service already running on the selected port.
    - Start the service hidden, wait for authenticated readiness, and then invoke the normal arena ui pairing flow.
    - Fail with actionable build instructions when required artifacts are absent.
    - Record and validate the launched process identity before stopping it.

chessboard:
  implementation: custom_svg
  authority: backend_fen_snapshots
  frontend_rule_authority: false

reports:
  model: immutable_report_document
  formats: [html, pdf, csv, json, pgn]
  requirements:
    - The Reports surface can generate a current-state report or a report for one selected persisted competition without requiring a command line.
    - Generation has explicit pending, success, and actionable failure feedback and refreshes the backend-authoritative report collection.
    - Every generated report lists its scope, data cutoff, provenance, and authenticated download controls for each rendered format.
    - Empty provider output remains truthful and does not prevent generation of a Manager report.
  common_fields:
    - filters
    - generation_parameters
    - schema_version
    - data_cutoff
    - content_hashes
    - provenance
