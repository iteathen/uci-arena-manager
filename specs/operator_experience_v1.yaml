meta:
  spec_id: arena_operator_experience_v1
  version: 1
  status: active
  owner: operator_surface

navigation:
  - overview
  - services
  - bots
  - engines
  - local_match_planner
  - live_games
  - tournaments
  - game_history
  - logs
  - statistics_health
  - reports
  - configuration
  - audit

requirements:
  - desktop_first_responsive
  - complete_tablet_support
  - safe_mobile_monitoring
  - light_and_dark_themes
  - keyboard_navigation
  - reduced_motion
  - visible_focus
  - wcag_2_1_aa_contrast
  - virtualized_logs_and_tables
  - server_side_filtering
  - websocket_batching
  - stale_data_indicators
  - service_profile_setup_for_book_forge
  - optional_external_service_integrations
  - auto_discovery_with_manual_locator_fallback
  - model_neutral_engine_identity
  - command_line_free_normal_startup
  - truthful_install_configuration_runtime_states
  - installed_cli_on_path_with_offline_help

engine_identity_experience:
  requirements:
    - Present UCI Arena Engine as an engine product, independently of its
      selected model package.
    - Do not use model names as engine cards, discovery hints, planner examples,
      or status labels.
    - Show the model package as separate metadata only when reported by the
      registered engine.

managed_service_experience:
  catalog_cards:
    - profile_id: book_forge
      state: available_when_configured
      callout: Existing external service
    - profile_id: uci_arena_evidence
      state: available_when_configured
      callout: Existing optional external service
  setup:
    - Label Book Forge and UCI Arena Evidence Service as optional.
    - Offer Auto-detect without registering or enabling a discovered candidate.
    - When discovery is incomplete or empty, keep manual paths and endpoint fields visible and editable.
    - Permit the operator to reconfigure a previously saved locator.
    - Show every required path or endpoint before validation.
    - Preview capabilities and ownership boundaries.
    - Never request external-service secrets that are not manager-owned.
    - Explain unavailable actions without presenting them as failures.
    - For provider-owned per-user startup registrations, show Probe plus
      Pause/Resume controls and a startup-owned status hint; do not show
      process Start, Stop, or Restart controls that would create a duplicate
      daemon.
    - Do not show an unconfigured optional service as an unhealthy manager resource.
    - Show Installed/Missing, Configured/Not configured, and current runtime
      activity as separate states on the catalog card.
    - When a signed component is missing, offer a reviewed foreground
      download/install plan without granting package authority to the service.

local_path_picker:
  owner: arena_ui_session_helper
  transport: token_scoped_loopback_http
  lifetime: foreground_arena_ui_process
  requirements:
    - The Manager service never opens a desktop dialog or impersonates the interactive user.
    - `arena ui` starts the picker only on loopback and puts an unguessable
      per-process bearer token in browser session storage during pairing.
    - Picker requests declare file or directory mode plus display-only hints
      and extension filters; they never supply a command, executable, or shell string.
    - Windows uses the native common item dialog in the logged-in session.
    - Linux uses an installed desktop portal-compatible picker helper and
      returns actionable manual-entry guidance when no helper is available.
    - A selected path is returned to the dashboard but is not registered,
      enabled, copied, hashed, or opened until the operator explicitly submits
      the owning validation or import action.
    - Closing `arena ui` removes picker authority without invalidating the
      already-paired Manager dashboard session.

desktop_launcher:
  executable: uci-arena-manager
  behavior:
    - Runs without a console window.
    - Verifies the local service, establishes pairing, starts the authenticated
      interactive-user helper, and opens the dashboard in the default browser.
    - Installs product-neutral application, installer, shortcut, and browser icons.
    - A second invocation reuses the per-user launcher and opens the dashboard.
  setup_helper:
    - Accepts only typed inventory, plan, and apply requests for catalog component ids.
    - Uses only the adjacent verified arena-setup, retained signed catalog, and fixed roots.
    - Rejects executable, argv, shell, and caller-selected catalog fields.
    - Shows dependencies, bytes, disk impact, elevation, and restart before confirmation.

cli_experience:
  executable: arena
  requirements:
    - Windows setup adds the installed bin directory to the machine PATH and
      removes only its own PATH entry during uninstall.
    - Linux packages install arena in the normal executable path and install
      arena(1) under the platform man hierarchy.
    - arena --help, every command help surface, the man page, and README use
      the same names for --endpoint, --data-dir, --output, and common commands.
    - Help documents that global flags precede the subcommand and includes
      status, health, doctor, ui, engine, service, and setup examples.

bot_experience:
  profile: lichess_bot
  requirements:
    - Replace the generic bot table with install, detection, account probe,
      readiness, options, and lifecycle views.
    - Use a token-file path only until broader account management is specified.
    - Detect and reject non-BOT accounts through the verified adapter.
    - Default engine selection to the verified uci_arena.engine component and
      show its model package separately.
    - Show every engine, knowledge, evidence, capacity, transport, credential,
      and startup blocker without claiming the bot is active.

knowledge_asset_setup:
  location: configuration
  requirements:
    - Offer browse-assisted opening-book, Syzygy directory, and Lichess
      token-file-reference selection with format-specific hints and filters.
    - Offer browse-assisted qualified timing, Lichess single-game, Lichess
      capacity, and Lichess transport profile selection with schema-specific
      filenames, identity guidance, and filters.
    - Explain that importing a Lichess single-game profile creates a bounded
      immutable managed copy of the profile and its hash-verified evidence
      closure; timing, capacity, transport, and Syzygy assets remain in place.
    - Offer copyable arena-setup commands for importing the selected existing
      paths and for downloading the exact signed missing-book or bounded
      tablebase components.
    - Generated commands place global arena-setup options before the selected
      subcommand so the copied command is directly executable.
    - The dashboard and Manager service never execute arena-setup package
      operations or acquire package-install authority. The token-reference
      mutation is the sole locator-only exception: it reuses path-metadata
      validation and cannot download, activate, repair, or remove a component.
    - Lichess token contents are never read, previewed, copied, or placed in
      the generated command; only the selected path is present.

local_development_launcher:
  entrypoint: run-local.cmd
  requirements:
    - Resolve binaries, web assets, data, logs, and helper scripts from the repository root rather than the caller working directory.
    - Reuse a healthy service already running on the selected port.
    - Start the service hidden, wait for authenticated readiness, and then invoke the normal arena ui pairing flow.
    - Fail with actionable build instructions when required artifacts are absent.
    - Record and validate the launched process identity before stopping it.

chessboard:
  implementation: custom_svg
  authority: backend_fen_snapshots
  frontend_rule_authority: false

reports:
  model: immutable_report_document
  formats: [html, pdf, csv, json, pgn]
  common_fields:
    - filters
    - generation_parameters
    - schema_version
    - data_cutoff
    - content_hashes
    - provenance
