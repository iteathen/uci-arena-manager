openapi: 3.1.0
info:
  title: UCI Arena Manager Control API
  version: 1.0.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: http://127.0.0.1:47831/api/v1
x-command-actions:
  engine_lifecycle:
    - engine.register
    - engine.refresh
  competition_lifecycle:
    - match.start
    - match.pause
    - match.resume
    - match.cancel
    - tournament.start
    - tournament.pause
    - tournament.resume
    - tournament.cancel
  evidence_orchestration:
    - service.evidence_target_register
    - service.evidence_campaign_enqueue
    - service.evidence_job_cancel
    - service.evidence_job_retry
  provider_startup_recovery:
    - service.recover
  reporting:
    - report.generate
  contract: >
    Lifecycle commands target a persisted match_plan or tournament resource,
    require its current revision, and return the durably updated resource.
    Progress is backend-authored in resource data and advanced by durable
    events after each game-state transition. A concurrent update returns the
    typed resource_revision_conflict error so an interactive client can
    refresh and retry a still-valid lifecycle action within a bounded policy.
  progress_contract:
    fields: [total_games, queued_games, active_games, completed_games, cancelled_games, failed_games, unplayed_games, percentage, current_round, updated_at]
    invariant: total_games_equals_sum_of_all_game_dispositions
    terminal_state: zero_active_zero_queued_all_games_resolved
x-competition-plan-contract:
  formats: [head_to_head, round_robin, gauntlet, swiss, sprt]
  common_parameters:
    - display_name
    - engine_ids
    - variant
    - games_per_pair
    - rounds
    - concurrency
    - seed
    - time_control
    - opening_suite
    - adjudication
    - engine_option_overrides
  sprt_parameters: [elo0, elo1, alpha, beta]
  rules:
    - Chess960 and opening-suite positions are persisted before execution.
    - Swiss pairings after round one and SPRT decisions are backend-authored.
    - Progress, Swiss byes, evaluations, and SPRT verdicts are resource data,
      never client-side projections.
    - Every saved-plan projection includes its stable resource id. A planned
      competition with no admitted game may be removed by resource.remove;
      all other competition lifecycle records remain durable.
x-interactive-helper-contract:
  origin: authenticated_desktop_launcher_session
  authority: receipt_verified_provider_adapter
  operations:
    - bot_credential_plan
    - bot_credential_materialize
    - bot_probe
    - bot_startup_control
    - bot_installed_qualification
    - bot_options_get
    - bot_options_update
    - bot_local_account_control
  rules:
    - These loopback helper operations are not Manager service endpoints and
      exist only for the interactive desktop-host lifetime.
    - Bot credential planning accepts no credential. Materialization accepts
      one bounded application/octet-stream body, writes it atomically to an
      access-restricted operator-owned external file, and commits only that
      path through the adjacent Installer locator transaction. The response is
      redacted and the operation is unavailable while provider startup is
      enabled.
    - Credential contents never enter JSON, a URL, argv, setup results, logs,
      Manager persistence, provider configuration, or browser storage.
    - Bot option requests carry only the
      uci_arena_lichess_manager_options_v1 allowlisted groups plus explicit
      rated/outbound confirmations.
    - Local account control carries one fixed action and its bounded typed
      scalar parameters. It never accepts paths, executable names, argv arrays,
      shell strings, token material, or raw provider configuration.
    - Installed qualification accepts only its schema marker. The helper
      resolves the fixed credential-free provider operation and receipt-owned
      paths, validates provider-owned outputs, commits their locators through
      adjacent Installer authority, and returns no path or raw evidence.
    - Installed qualification may project one validated provider-owned failure
      code, stage, and single-line bounded detail. It rejects path-bearing,
      credential-bearing, malformed, or unstructured child diagnostics and
      substitutes generic Manager-owned remediation without changing locators.
    - The helper resolves provider command prefixes from the exact
      receipt-verified operation catalog. Its response separates startup
      registration from provider activity, readiness, stream connectivity,
      and bounded blockers.
    - Bot startup recovery is one credential-free fixed action from that
      catalog. It starts only an existing enabled provider registration and
      never accepts or returns a command, path, argv array, or credential.
paths:
  /auth/server-proof:
    post:
      operationId: proveManagerServerIdentity
      description: >
        Return a keyed proof for one fresh 32-byte lowercase hexadecimal
        challenge. The proof is domain-separated and bound to the service's own
        configured numeric loopback origin, which is returned as the audience;
        the caller cannot select that audience. This endpoint accepts no bearer
        credential and exists so a local client can authenticate the exact
        Manager endpoint before disclosing its bearer key.
      responses:
        "200":
          description: Bounded keyed Manager identity proof
        "400":
          $ref: "#/components/responses/Problem"
  /auth/pair-token:
    post:
      operationId: issuePairingToken
      responses:
        "200":
          description: One-time local browser pairing token
  /auth/pair:
    post:
      operationId: exchangePairingToken
      responses:
        "200":
          description: HttpOnly local session and CSRF token
  /auth/session:
    get:
      operationId: resumeBrowserSession
      description: >
        Return the CSRF value for the existing unexpired HttpOnly browser
        session. This does not create or extend a session.
      responses:
        "200":
          description: Existing browser session CSRF token
        "401":
          $ref: "#/components/responses/Problem"
  /system/readiness:
    get:
      operationId: getSystemReadiness
      description: >
        Return the authenticated service-owned core readiness contract. The
        endpoint is reachable only after listener binding and event-loop entry;
        provider and installed Engine reconciliation remain separately visible
        and never gate core_ready.
      responses:
        "200":
          description: Authenticated Manager core readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemReadiness"
        "401":
          $ref: "#/components/responses/Problem"
  /system/status:
    get:
      operationId: getSystemStatus
      responses:
        "200":
          description: Current service state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
  /engines:
    get:
      operationId: listEngines
      responses:
        "200":
          description: Registered UCI engines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
  /match-plans:
    get:
      operationId: listMatchPlans
      responses:
        "200":
          description: Local match plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
  /tournaments:
    get:
      operationId: listTournaments
      description: >
        Return persisted tournament plans with backend-authoritative lifecycle
        and progress. Mutations use the typed command endpoint.
      responses:
        "200":
          description: Tournament resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
  /engine-candidates:
    get:
      operationId: listEngineCandidates
      description: >
        Return installed, imported, and bounded-discovery UCI engine candidates.
        Discovery never registers an engine.
      parameters:
        - in: query
          name: root
          required: false
          schema:
            type: string
          description: Explicit local file or bounded directory to inspect.
      responses:
        "200":
          description: Candidate collection in source precedence order
          content:
            application/json:
              schema:
                type: object
                required: [schema, schema_version, precedence, candidates]
                properties:
                  schema:
                    const: arena_engine_candidates_v1
                  schema_version:
                    const: 1
                  precedence:
                    type: array
                    items:
                      type: string
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/EngineCandidate"
  /engine-probes:
    post:
      operationId: probeEngine
      description: >
        Run the engine.register dry-run path under the Manager service identity.
        A successful probe does not persist an engine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, executable, working_directory]
              properties:
                candidate_id:
                  type: string
                display_name:
                  type: string
                executable:
                  type: string
                working_directory:
                  type: string
                arguments:
                  type: array
                  items:
                    type: string
                uci_options:
                  type: object
                  description: >
                    Bounded UCI option overrides applied before readyok and
                    persisted for subsequent launches. Every key must be
                    advertised by the probed engine.
      responses:
        "200":
          description: Engine passed the complete registration probe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineProbeResult"
        "422":
          description: Engine failed one or more probe stages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineProbeResult"
  /components:
    get:
      operationId: listInstallableComponents
      description: >
        Return the current process-local asynchronous component-verification
        projection and retained signed-catalog availability. This read surface
        never installs a component and never hashes payloads on the request
        thread.
      responses:
        "200":
          description: Component installation inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentInventory"
  /bot-profiles:
    get:
      operationId: listBotProfiles
      responses:
        "200":
          description: Built-in bot adapter profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BotProfile"
  /bot-candidates:
    get:
      operationId: listBotCandidates
      description: >
        Detect verified adapter, configuration, token-reference, and startup
        state without reading credentials or registering a bot.
      responses:
        "200":
          description: Bot onboarding candidates and blockers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotDiscovery"
  /providers/{profileId}/status:
    get:
      operationId: getProviderStatus
      description: >
        Return a bounded current-status projection from the exact
        receipt-verified provider operation. The Manager never supplies a
        credential. Status v3 explicitly reports durable supervision and
        incident projections unavailable; closed status v4 and v5 expose the
        Provider-owned supervision and incident summary without transferring
        recovery or cooldown authority to Manager.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            enum: [lichess_bot]
      responses:
        "200":
          description: Current provider status is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStatusProjection"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /providers/{profileId}/incidents:
    get:
      operationId: listProviderIncidents
      description: >
        Return one closed bounded Provider incident page through the exact
        receipt-verified incidents_list operation. Operation absence is an
        explicit unavailable projection with a null page; it is never an empty
        fabricated incident set. Manager supplies no credential and never
        opens Provider storage, runtime files, or logs.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            enum: [lichess_bot]
        - name: filter
          in: query
          required: false
          schema:
            enum: [active, all]
            default: active
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Incident page or explicit feature-unavailable projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderIncidentPageProjection"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /providers/{profileId}/games:
    get:
      operationId: listProviderGames
      description: >
        Return one closed bounded Provider-owned game page through the exact
        receipt-verified games_list operation. Manager supplies no credential,
        persists no Provider record, and never opens Provider storage.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            enum: [lichess_bot]
        - name: scope
          in: query
          required: false
          schema:
            enum: [live, history]
            default: live
        - name: before
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Provider game page or explicit feature-unavailable projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderGamePageProjection"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /providers/{profileId}/games/{gameId}:
    get:
      operationId: getProviderGame
      description: >
        Return one closed bounded Provider-owned game detail through the exact
        receipt-verified game_get operation. Replay is present only for a
        complete or reconciled archive and consists solely of Provider-authored
        FEN transitions; Manager performs no chess-rule reconstruction.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            enum: [lichess_bot]
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,64}$'
      responses:
        "200":
          description: Provider game detail or explicit feature-unavailable projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderGameProjection"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /resources/{kind}:
    get:
      operationId: listResources
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resources of the requested kind
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
  /service-profiles:
    get:
      operationId: listServiceProfiles
      responses:
        "200":
          description: Built-in service adapter capability manifests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceProfile"
  /service-profiles/{profileId}/discovery:
    get:
      operationId: discoverServiceProfile
      description: >
        Resolve non-secret local hints for an optional service profile. An
        empty candidates array is a successful result.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            enum: [book_forge, uci_arena_evidence]
      responses:
        "200":
          description: Service locator candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDiscovery"
        "404":
          $ref: "#/components/responses/Problem"
  /reports/{reportId}/artifacts/{format}:
    get:
      operationId: downloadReportArtifact
      description: >
        Return one immutable report artifact after validating its report UUID,
        allowlisted format, fixed storage location, and persisted SHA-256 digest.
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: path
          required: true
          schema:
            enum: [html, pdf, csv, json, pgn]
      responses:
        "200":
          description: Authenticated immutable report artifact
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /commands:
    post:
      operationId: submitCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
      responses:
        "200":
          description: Synchronously completed command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        "202":
          description: Accepted long-running operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /events:
    get:
      operationId: eventStream
      description: >
        WebSocket upgrade endpoint. Clients may supply `after` with the last
        durable cursor. An expired cursor produces a resync-required event.
      parameters:
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "101":
          description: WebSocket protocol switch
  /events/snapshot:
    get:
      operationId: getEventSnapshot
      parameters:
        - name: cursor
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Durable events after the cursor
components:
  responses:
    Problem:
      description: RFC Problem Details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    EngineCandidate:
      $ref: "schemas/engine-candidate.schema.json"
    EngineProbeResult:
      $ref: "schemas/engine-probe-result.schema.json"
    ComponentInventory:
      type: object
      additionalProperties: false
      required:
        - schema
        - schema_version
        - verification_state
        - retained_catalog_available
        - components
      properties:
        schema:
          const: arena_component_inventory_v1
        schema_version:
          const: 1
        verification_state:
          enum: [checking, verified, failed]
        retained_catalog_available:
          type: boolean
        components:
          type: array
          maxItems: 32
          items:
            type: object
            additionalProperties: true
            required:
              - component_id
              - display_name
              - optional
              - package_state
              - downloadable
              - verification_state
            properties:
              component_id:
                type: string
                maxLength: 128
              display_name:
                type: string
                maxLength: 128
              optional:
                type: boolean
              package_state:
                enum: [checking, missing, installed, broken]
              downloadable:
                type: boolean
              verification_state:
                enum: [checking, verified, failed]
              verification_issue:
                type: object
                additionalProperties: false
                required: [code, detail]
                properties:
                  code:
                    type: string
                    maxLength: 128
                  detail:
                    type: string
                    maxLength: 512
    BotProfile:
      type: object
      required: [profile_id, display_name, adapter_component_id, optional]
      properties:
        profile_id:
          const: lichess_bot
        display_name:
          type: string
        adapter_component_id:
          const: lichess.adapter
        optional:
          const: true
    BotDiscovery:
      type: object
      required: [schema, schema_version, candidates]
      properties:
        schema:
          const: arena_bot_candidates_v1
        schema_version:
          const: 1
        candidates:
          type: array
          items:
            type: object
    ProviderStatusProjection:
      type: object
      additionalProperties: false
      required:
        - schema
        - schema_version
        - profile_id
        - availability
        - provider_contract_version
        - provider_status_schema
        - supervision_availability
        - incident_availability
        - status
      properties:
        schema:
          const: arena_provider_status_projection_v1
        schema_version:
          const: 1
        profile_id:
          const: lichess_bot
        availability:
          const: available
        provider_contract_version:
          type: string
          pattern: '^1\.[0-9]+$'
          maxLength: 32
        provider_status_schema:
          enum:
            - uci_arena_lichess_status_v3
            - uci_arena_lichess_status_v4
            - uci_arena_lichess_status_v5
        supervision_availability:
          enum: [available, unavailable]
        incident_availability:
          enum: [available, unavailable]
        status:
          $ref: "#/components/schemas/LichessProviderStatus"
    LichessProviderStatus:
      $ref: "schemas/lichess-provider-status.schema.json"
    ProviderIncidentPageProjection:
      type: object
      additionalProperties: false
      required:
        - schema
        - schema_version
        - profile_id
        - availability
        - provider_contract_version
        - page
      properties:
        schema:
          const: arena_provider_incident_page_projection_v1
        schema_version:
          const: 1
        profile_id:
          const: lichess_bot
        availability:
          enum: [available, unavailable]
        provider_contract_version:
          type: string
          pattern: '^1\.[0-9]+$'
          maxLength: 32
        page:
          oneOf:
            - $ref: "#/components/schemas/ProviderIncidentPage"
            - type: "null"
    ProviderIncidentPage:
      $ref: "schemas/provider-incident-page.schema.json"
    ProviderGamePageProjection:
      type: object
      additionalProperties: false
      required:
        - schema
        - schema_version
        - profile_id
        - availability
        - provider_contract_version
        - page
      properties:
        schema:
          const: arena_provider_game_page_projection_v1
        schema_version:
          const: 1
        profile_id:
          const: lichess_bot
        availability:
          enum: [available, unavailable]
        provider_contract_version:
          type: string
          pattern: '^1\.[0-9]+$'
          maxLength: 32
        page:
          oneOf:
            - $ref: "#/components/schemas/ProviderGamePage"
            - type: "null"
    ProviderGameProjection:
      type: object
      additionalProperties: false
      required:
        - schema
        - schema_version
        - profile_id
        - availability
        - provider_contract_version
        - game
      properties:
        schema:
          const: arena_provider_game_projection_v1
        schema_version:
          const: 1
        profile_id:
          const: lichess_bot
        availability:
          enum: [available, unavailable]
        provider_contract_version:
          type: string
          pattern: '^1\.[0-9]+$'
          maxLength: 32
        game:
          oneOf:
            - $ref: "#/components/schemas/ProviderGame"
            - type: "null"
    ProviderGamePage:
      $ref: "schemas/provider-game-page.schema.json"
    ProviderGame:
      $ref: "schemas/provider-game-detail.schema.json"
    LichessProviderStatusV3:
      type: object
      additionalProperties: false
      required:
        - schema
        - installed
        - registered
        - active
        - ready
        - stream_connected
        - stream_state
        - runtime_updated_at
        - account
        - capacity
        - games
        - scheduler
        - rate_limit
        - blockers
      properties:
        schema:
          const: uci_arena_lichess_status_v3
        installed:
          type: boolean
        registered:
          type: boolean
        active:
          type: boolean
        ready:
          type: boolean
        stream_connected:
          type: boolean
        stream_state:
          enum:
            - starting
            - reconciling
            - connecting
            - waiting_for_api_cooldown
            - connected
            - disconnected
        runtime_updated_at:
          type: [string, "null"]
          format: date-time
          maxLength: 64
        account:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [username, bot]
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: '^[A-Za-z0-9_-]+$'
                bot:
                  const: true
        capacity:
          type: object
          additionalProperties: false
          required: [configured, qualified, slots]
          properties:
            configured:
              type: [integer, "null"]
              minimum: 0
              maximum: 64
            qualified:
              type: [integer, "null"]
              minimum: 0
              maximum: 64
            slots:
              $ref: "#/components/schemas/ProviderSlotCounts"
        games:
          type: object
          additionalProperties: false
          required: [active, preparing, pending, cancelling, draining]
          properties:
            active:
              type: integer
              minimum: 0
              maximum: 64
            preparing:
              type: integer
              minimum: 0
              maximum: 64
            pending:
              type: integer
              minimum: 0
              maximum: 64
            cancelling:
              type: integer
              minimum: 0
              maximum: 64
            draining:
              type: integer
              minimum: 0
              maximum: 64
        scheduler:
          type: object
          additionalProperties: false
          required: [enabled, paused, target_active_bots, fault]
          properties:
            enabled:
              type: boolean
            paused:
              type: boolean
            target_active_bots:
              type: [integer, "null"]
              minimum: 0
              maximum: 64
            fault:
              oneOf:
                - type: "null"
                - type: object
                  additionalProperties: false
                  required: [kind, status]
                  properties:
                    kind:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: '^[A-Za-z0-9._-]+$'
                    status:
                      type: [integer, "null"]
                      minimum: 100
                      maximum: 599
        rate_limit:
          $ref: "#/components/schemas/ProviderRateLimitStatus"
        blockers:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]+$'
    ProviderSlotCounts:
      type: object
      additionalProperties: false
      required: [empty, preparing, pending, cancelling, active, draining]
      properties:
        empty:
          type: integer
          minimum: 0
          maximum: 64
        preparing:
          type: integer
          minimum: 0
          maximum: 64
        pending:
          type: integer
          minimum: 0
          maximum: 64
        cancelling:
          type: integer
          minimum: 0
          maximum: 64
        active:
          type: integer
          minimum: 0
          maximum: 64
        draining:
          type: integer
          minimum: 0
          maximum: 64
    ProviderRateLimitStatus:
      type: object
      additionalProperties: false
      required:
        - state
        - cooldown_until
        - cooldown_remaining_ms
        - strike_count
        - challenge_state
        - challenge_blocked_until
        - challenge_remaining_ms
        - challenge_strike_count
        - queue_depth
        - in_flight_class
        - client_lease
      properties:
        state:
          enum:
            - unknown
            - ready
            - cooldown
            - challenge_quarantined
            - challenge_half_open
        cooldown_until:
          type: [integer, "null"]
          minimum: 0
          maximum: 9007199254740991
        cooldown_remaining_ms:
          type: [integer, "null"]
          minimum: 0
          maximum: 9007199254740991
        strike_count:
          type: [integer, "null"]
          minimum: 0
          maximum: 9007199254740991
        challenge_state:
          enum: [unknown, ready, quarantined, half_open_ready, half_open]
        challenge_blocked_until:
          type: [integer, "null"]
          minimum: 0
          maximum: 9007199254740991
        challenge_remaining_ms:
          type: [integer, "null"]
          minimum: 0
          maximum: 9007199254740991
        challenge_strike_count:
          type: [integer, "null"]
          minimum: 0
          maximum: 9007199254740991
        queue_depth:
          type: [integer, "null"]
          minimum: 0
          maximum: 9007199254740991
        in_flight_class:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]+$'
        client_lease:
          type: object
          additionalProperties: false
          required: [state, active_clients, heartbeat_at, expires_at]
          properties:
            state:
              enum: [unknown, authoritative, missing, conflict]
            active_clients:
              type: [integer, "null"]
              minimum: 0
              maximum: 9007199254740991
            heartbeat_at:
              type: [integer, "null"]
              minimum: 0
              maximum: 9007199254740991
            expires_at:
              type: [integer, "null"]
              minimum: 0
              maximum: 9007199254740991
    SystemStatus:
      type: object
      required:
        - schema_version
        - service
        - version
        - host_id
        - started_at
        - database
        - counts
        - installed_service_reconciliation
        - installed_engine_reconciliation
      properties:
        schema_version:
          const: 1
        service:
          const: uci-arena-manager
        version:
          type: string
        host_id:
          const: local
        started_at:
          type: string
          format: date-time
        database:
          enum: [ready, degraded]
        counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        installed_service_reconciliation:
          $ref: "#/components/schemas/StartupReconciliation"
        installed_engine_reconciliation:
          $ref: "#/components/schemas/StartupReconciliation"
    SystemReadiness:
      type: object
      additionalProperties: false
      required:
        - schema
        - service
        - version
        - state
        - started_at
        - installed_service_reconciliation
        - installed_engine_reconciliation
      properties:
        schema:
          const: arena_manager_readiness_v1
        service:
          const: uci-arena-manager
        version:
          type: string
        state:
          const: core_ready
        started_at:
          type: string
          format: date-time
        installed_service_reconciliation:
          $ref: "#/components/schemas/StartupReconciliation"
        installed_engine_reconciliation:
          $ref: "#/components/schemas/StartupReconciliation"
    StartupReconciliation:
      type: object
      required: [schema, state]
      properties:
        schema:
          type: string
          enum:
            - arena_installed_service_reconciliation_v1
            - arena_installed_engine_reconciliation_v1
        state:
          enum: [not_run, pending, running, complete, complete_with_errors, failed]
        phase:
          type: string
          maxLength: 64
        completed:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        observed_at:
          type: string
          format: date-time
        errors:
          type: array
          maxItems: 64
          items:
            type: object
    Resource:
      type: object
      required:
        - id
        - host_id
        - kind
        - revision
        - created_at
        - updated_at
        - labels
        - data
      properties:
        id:
          type: string
          format: uuid
        host_id:
          const: local
        kind:
          type: string
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        labels:
          type: object
          additionalProperties:
            type: string
        data:
          type: object
    ServiceProfile:
      type: object
      required:
        - profile_id
        - display_name
        - implementation_state
        - optional
        - capabilities
        - required_configuration
        - discovery
      properties:
        profile_id:
          enum: [book_forge, uci_arena_evidence]
        display_name:
          type: string
        implementation_state:
          enum: [implemented_external, in_development_external, planned_external]
        optional:
          const: true
        capabilities:
          type: array
          items:
            type: string
        required_configuration:
          type: array
          items:
            type: string
        discovery:
          type: object
    ServiceDiscovery:
      type: object
      required: [schema_version, profile_id, candidates, manual_configuration]
      properties:
        schema_version:
          const: 1
        profile_id:
          enum: [book_forge, uci_arena_evidence]
        candidates:
          type: array
          items:
            type: object
        manual_configuration:
          type: array
          items:
            type: string
    CommandRequest:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - idempotency_key
        - target
        - action
        - dry_run
        - parameters
      properties:
        schema_version:
          const: 1
        request_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
        target:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
            id:
              type: [string, "null"]
              format: uuid
        action:
          type: string
        expected_revision:
          type: [integer, "null"]
          minimum: 0
        dry_run:
          type: boolean
        parameters:
          type: object
    CommandResult:
      type: object
      required:
        - schema_version
        - request_id
        - command_id
        - status
      properties:
        schema_version:
          const: 1
        request_id:
          type: string
          format: uuid
        command_id:
          type: string
          format: uuid
        status:
          enum: [completed, accepted, rejected]
        resource:
          oneOf:
            - $ref: "#/components/schemas/Resource"
            - type: "null"
        operation_id:
          type: [string, "null"]
          format: uuid
        error:
          oneOf:
            - $ref: "#/components/schemas/Problem"
            - type: "null"
    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
