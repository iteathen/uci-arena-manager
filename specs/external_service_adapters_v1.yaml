meta:
  spec_id: arena_external_service_adapters_v1
  version: 1
  status: active
  owner: service_adapters

purpose: >
  Define how independently built services are discovered, configured, observed,
  and controlled without importing their source, depending on their repository
  layout, or reading their private storage.

common_contract:
  resource_kind: managed_service
  optional_profiles: true
  manager_readiness_without_profiles: fully_operational
  manager_service_api:
    schema: uci_arena_manager_service_api_v1
    compatible_versions: ["1.x"]
    transport: cli_json
    manifest_entrypoint: cli
    manifest_arguments: [api]
    required_operations:
      - describe
      - status
      - outputs_list
      - outputs_inspect
      - config_validate
    output_schema: uci_arena_service_output_v1
    discovery:
      installed: exact_manager_integration_api_from_verified_arena_component_manifest
      manual: manager_profile_expectation_confirmed_by_api_describe
    compatibility:
      - The envelope schema, API major, component id, operation, success state,
        and payload shape are validated on every invocation.
      - An installed service envelope must report the exact component version
        from its verified receipt and component manifest.
      - API describe must confirm the required operations, transport,
        invocation prefix, output schema, configuration schema, and status
        schema before status or output metadata is integrated.
      - The five common operations are a required subset of a bounded unique
        operation list. Signed provider-specific typed operations may extend
        that list; Manager retains them and invokes only explicitly supported
        operations that API describe also confirms.
      - Unknown major versions, component substitution, missing operations,
        malformed envelopes, oversized projections, and output path escape
        evidence mark the integration incompatible.
      - Additive fields and compatible minor versions may be ignored.
    transport_limits:
      maximum_machine_output_bytes: 1048576
      maximum_transport_line_bytes: 1048576
      maximum_queued_transport_bytes: 8388608
      rules:
        - Provider output is byte-bounded before JSON parsing; a process cannot
          consume unbounded Manager memory by omitting newlines or streaming
          an oversized response.
        - A bounded-output or malformed-output violation is incompatible
          contract evidence. A launch failure or timeout is temporary
          unavailability and preserves the last validated output projection as
          stale.
  required_fields:
    - profile_id
    - display_name
    - integration_state
    - desired_state
    - observed_state
    - capabilities
    - health
    - configuration
  integration_states: [planned, configured, available, incompatible, unavailable]
  transports: [process, native_service, http]
  allowed_actions:
    - discover
    - validate
    - start
    - stop
    - restart
    - pause
    - resume
    - status
  boundaries:
    - Neither Book Forge nor UCI Arena Evidence Service is required for manager startup, local matches, tournaments, CLI use, or dashboard use.
    - An unconfigured optional service creates no resource, warning, degraded state, or background process.
    - Configuration contains explicit executable, endpoint, and filesystem paths.
    - Process actions use native argv arrays and never a shell command.
    - Native service actions cross the allowlisted broker by manager resource id.
    - HTTP actions must be declared by a versioned capability document.
    - No adapter imports service source, reads a service-owned database, or assumes a repository root.
    - Current provider components at version 0.3.0 and later expose status and
      output metadata through the common Manager service API. Manager never
      scans provider storage, opens provider databases, or infers output
      identity from filenames.
    - Installed 0.2.x components retain a bounded public-CLI compatibility
      adapter for upgrade continuity only. They cannot claim Manager API
      compatibility, and upgrading them to 0.3.x activates manifest-discovered
      API integration.
    - Secrets use SecretReference ids and are never copied into managed-service data.
    - Missing optional capabilities produce unavailable actions, not startup failure.
    - Installed services are reconciled only from enabled arena_install_receipt_v1 receipts.
    - V1 permits one configured managed-service resource per profile. Manual
      registration rejects an already configured profile. Receipt
      reconciliation reuses an exact receipt-owned resource; when only an
      operator-configured resource exists it preserves that locator and does
      not create a competing packaged resource or silently overwrite operator
      intent. Preservation performs no implicit probe or launch; the normal
      bounded page/status action refreshes that manual instance.
    - Databases created before the cardinality rule may retain duplicate
      manual resources until explicit cleanup. The receipt-owned resource is
      the catalog-card authority, every duplicate remains visible in the
      instance list, and only an inactive non-receipt-owned resource may be
      removed through the audited resource command. Receipt-owned resources
      are changed or removed only through Suite Setup.
    - Reconciliation verifies the complete immutable private runtime and provider component file sets by exact size and SHA-256, rejects symbolic links and unlisted files, and never launches an unverifiable component.
    - "Reconciliation resolves managed dependency entrypoints with the same
      narrow compatibility rule as arena-setup: an already locked and
      attested node_runtime.private candidate may use executable only when the
      canonical node key is absent. The aliased path still requires an exact
      signed file inventory match; no provider, engine, model, or arbitrary
      component receives this alias, and new managed candidates emit node."
    - Installer-generated provider configuration may reference only exact dependency entrypoints from verified receipts and must remain inside the declared provider workspace.
    - An installed receipt whose provider startup result reports installed true
      reconciles with desired_state running.
    - Manager startup invokes each reconciled installed provider's public status
      contract even when component digests are unchanged, so output
      integrations and observed state cannot remain stale across an installer
      restart.
    - A provider daemon reported explicitly active, process-alive, and non-stale
      by its public status contract is observed as running even when the Manager
      process supervisor did not launch that per-user startup instance. A
      remembered phase, pid, heartbeat, startup registration, or desired state
      is not live runtime authority.
    - Provider-owned status must distinguish stale or replaced process-instance
      ownership from an exact live owner. Manager preserves that bounded typed
      blocker and never upgrades pid-only evidence to running authority.
    - Per-user provider startup registrations remain provider-owned. Manager
      never starts a duplicate daemon when startup_installed is true; status,
      pause, and resume remain available, while process start/stop/restart are
      omitted. Recovery is exposed only when the receipt-verified component API
      declares its credential-free startup_recover operation.
  operator_projection:
    dimensions:
      package: [installed, missing, broken]
      integration: [not_configured, configured, incompatible]
      runtime: [active, paused, stopped, degraded, unavailable, unknown]
    requirements:
      - Catalog availability is never displayed as installation or runtime activity.
      - Configured services expose the last successful status sample time.
      - Page entry and bounded refresh invoke the public status contract.
      - Desired state is never presented as observed runtime activity. A Start
        or Restart acknowledgement may project starting, but running requires
        a fresh provider status sample or a live Manager-owned process.
      - A provider status payload whose daemon phase is stopped, failed, empty,
        or stale cannot be projected as running solely because desired_state
        is running or a launch request returned successfully.
      - Provider-owned runtime status without explicit daemon active,
        process-alive, and stale booleans fails closed to stopped with unknown
        health. Validated output projections remain available, but they never
        substitute for live process authority.
      - When an installed provider reports startup recovery in progress,
        Manager keeps startup enabled, preserves exact process activity while
        holding readiness false, preserves the typed recovery blocker, and
        offers only a component-declared provider-owned recovery operation; it
        never launches a duplicate process directly.
      - Compatible saved, environment, PATH, and receipt hints are merged into
        complete candidates before partial candidates are returned.
      - Describe, status, and configuration probes use the normal bounded
        provider-command deadline. A changed or initial immutable output list
        may use a separate deadline of at most sixty seconds because the
        provider must validate advertised artifacts before returning them.
      - A provider-command timeout or temporary launch failure is unavailable,
        not evidence of API incompatibility. Manager preserves the last
        successfully validated output projection and cursor, marks them stale,
        and exposes both the failure reason and last-successful sample time.
      - Schema, identity, path, digest, or envelope validation failures remain
        incompatible and discard projections whose authority can no longer be
        established.

lichess_provider_contract:
  schema: uci_arena_service_contract_v1
  transport: cli_json
  authority: verified_installer_receipt_and_immutable_component_manifest
  rules:
    - Manager validates the exact service contract, operation catalog,
      configuration schemas, status schema, entrypoint, component identity,
      component version, and receipt digests before invoking any bot operation.
    - The provider-specific projection owns request validation and response
      reduction, while the generic installed-component verifier owns paths,
      file inventories, digests, contract compatibility, and shell-free
      transport.
    - Fixed command prefixes come from the operation catalog. Browser input
      never selects an operation catalog entry directly and never supplies an
      executable, working directory, command prefix, path, argv array, shell
      string, or credential value.
    - Unknown contract majors, missing required operations, unsafe contract
      paths, substituted identities, and digest drift are incompatible before
      process launch. Additive minor operations remain inert until explicitly
      supported by the Manager provider projection.

profiles:
  book_forge:
    display_name: Book Forge
    current_state: implemented_external
    runtime: external_node_process_or_native_startup_registration
    minimum_contract:
      status_schema: uci_arena_book_forge_status_v2
      cli_machine_output: json
      heartbeat_seconds: 15
      stale_seconds: 300
      schema_identity_migration:
        accepted_legacy_shape: exact_book_forge_status_version_suffix
        normalization: canonical_status_schema_before_projection
        restrictions:
          - A legacy prefix is compatibility metadata only and never a service,
            engine, model, discovery, or display identity.
          - Manager responses and persisted resource state expose only the
            canonical UCI Arena schema.
    declared_capabilities:
      - status
      - start
      - stop
      - restart
      - pause
      - resume
      - acquisition_status
      - acquisition_run
      - acquisition_retry_auth
      - snapshot_build
      - validate
      - publish
      - maintain
      - startup_install
      - startup_status
      - startup_uninstall
    configuration:
      - node_executable
      - cli_entrypoint
      - workspace
      - optional_config_path
      - optional_native_launcher
    discovery:
      sources:
        - arena_setup_saved_locator
        - process_environment_hints
        - executable_path
      environment_hints:
        - BOOK_FORGE_NODE
        - BOOK_FORGE_CLI
        - BOOK_FORGE_WORKSPACE
      behavior:
        - A validated arena-setup locator is considered before environment and PATH hints and may contribute a packaged CLI while the operator supplies any remaining fields.
        - Discovery returns zero or more candidates and never registers one automatically.
        - A complete candidate requires a Node executable, CLI entrypoint, and workspace.
        - The dashboard always permits manual path entry when no complete candidate is found.
    health_projection:
      - phase
      - heartbeat_age_seconds
      - resource_mode
      - acquisition_state
      - daily_request_budget
      - last_cycle
      - redacted_last_error
    output_integration:
      authority: book_forge
      source: versioned_manager_service_api
      contract:
        - API output records identify immutable integration and qualified snapshots.
        - Book Forge validates every advertised snapshot before producing its typed output record.
        - Snapshot id, channel, manifest digest, artifact digests,
          qualification state, record count, immutable root, and validated
          current live-channel root are projected without rewriting the snapshot.
        - A digest, identity, channel, or schema mismatch marks the integration incompatible.
        - The bounded projection retains the validated snapshot root solely so
          the authenticated desktop setup helper can offer an explicit
          opening-book import plan. Manager never opens the snapshot or treats
          the path as activation authority; Installer revalidates it before
          committing either service_managed_live_channel or
          immutable_pinned_snapshot authority and regenerating consumers.
        - The dashboard selects an explicit receipt-managed engine resource
          for output activation, or the sole such resource when unambiguous.
          A regenerated candidate must advertise the requested output binding.
          Refresh targets that exact resource UUID even when another resource
          uses the same component. Activation is confirmed only after a fresh
          resource read verifies the requested binding and current candidate;
          an unsupported or unconfirmed binding remains saved, not active.
    safety:
      - Book Forge remains authority for its workspace, catalog, resource governor, and publication.
      - The manager invokes only its public CLI and reads only its machine-readable status.
      - Authentication tokens remain owned by Book Forge and are never accepted by this adapter.
      - Pausing and resuming use Book Forge durable controls.
      - The manager does not replace Book Forge single-instance enforcement or startup registration.
      - Installer activation and token-path refresh may invoke only Book
        Forge's public acquisition retry-auth operation, validate its bounded
        response, and never read or forward credential contents.

  uci_arena_evidence:
    display_name: UCI Arena Evidence Service
    current_state: implemented_external
    runtime: external_node_process_or_per_user_startup_registration
    status_schema: uci_arena_evidence_status_v1
    minimum_node: 24.15.0
    default_integration_state: configured
    purpose: >
      Produce immutable, versioned arena evidence, including time-control
      performance curves, confidence intervals, match observations, and
      provenance that the manager may use for planning and reports.
    declared_capabilities:
      - status
      - start
      - stop
      - restart
      - pause
      - resume
      - init
      - target_add
      - target_list
      - target_remove
      - job_enqueue
      - job_list
      - job_cancel
      - job_retry
      - dataset_list
      - dataset_show
      - dataset_export
      - profile_list
      - prune
      - startup_install
      - startup_status
      - startup_uninstall
    cli_contract:
      machine_output: json
      manager_service_api: [api]
      status: [status, --json]
      daemon: [daemon]
      pause: [pause, --reason, uci-arena-manager]
      resume: [resume]
      global_workspace: [--workspace, PATH]
    configuration:
      - node_executable
      - cli_entrypoint
      - workspace
      - optional_config_path
    discovery:
      sources:
        - arena_setup_saved_locator
        - process_environment_hints
        - executable_path
      environment_hints:
        - UCI_ARENA_EVIDENCE_NODE
        - UCI_ARENA_EVIDENCE_CLI
        - UCI_ARENA_EVIDENCE_ROOT
      behavior:
        - A validated arena-setup locator is considered before environment and PATH hints and may contribute a packaged CLI while the operator supplies any remaining fields.
        - Discovery returns candidates but never enables the optional integration automatically.
        - A complete candidate requires a Node executable, CLI entrypoint, and workspace.
        - The dashboard always permits manual path entry when no complete candidate is found.
    status_projection:
      - control
      - collection
      - daemon
      - jobs
      - targets
      - datasets
      - sampledAt
    output_integration:
      authority: uci_arena_evidence_service
      source: versioned_manager_service_api
      contract:
        - Manager validates the API status payload and obtains dataset and
          qualified timing-profile metadata through api outputs list.
        - Every output uses uci_arena_service_output_v1 and a declared output
          kind; service-specific schema and identity remain in the typed
          compatibility projection.
        - Manager stores only a bounded allowlisted projection of dataset identity, campaign, state, target identity, authority, observation count, and timestamps; unknown fields are discarded and sensitive-looking nested fields are redacted.
        - Dataset lifecycle is provider-authoritative and accepts collecting,
          completed, and cancelled. A cancelled dataset remains valid retained
          evidence and must not make the complete Evidence integration
          incompatible.
        - Every timing-profile output retains its path, digest, semantic timing
          identity, qualified and current engine-build provenance, permissions,
          publication source, and service-publication metadata.
        - A timing profile is visible but remains non-consumable when its
          timing-relevant identity does not match the configured time and
          search contract, model semantics, provider and runtime, hardware, or
          search topology. An engine-build digest mismatch alone remains
          visible provenance and does not block reuse. Manager never decides
          compatibility or rewrites profile identity or permissions.
        - Manager never requests or stores raw observations and never reads the service SQLite catalog.
        - A qualified profile may be explicitly selected through the
          authenticated desktop setup helper. Installer remains locator and
          consumer-configuration authority, and Manager then refreshes only
          the existing receipt-managed Engine through its normal full probe.
          Publication alone never changes live Engine authority.
        - Waiting for a target and an empty dataset set remain healthy.
        - A dataset schema or identity mismatch marks the integration incompatible.
    orchestration_integration:
      operations: [orchestration_status, target_register, campaign_enqueue, job_control]
      rules:
        - Runtime v2 is an additive optional engine-owned profile. A selected
          receipt-managed engine declares evidence_runtime_contract_v2 and
          names its inventoried evidence_runtime_contract entrypoint. Manager
          binds the current manifest hash and supplier identity after inventory
          verification, preserves that binding with the registered engine,
          and repeats discovery plus the universal UCI probe before forwarding
          the exact registered executable, arguments, working directory and
          option overrides through a bounded 8192-byte target JSON descriptor.
          Changed bindings require engine refresh. Absent capability yields
          a typed unsupported result without affecting generic UCI admission.
          No product identifier, default model or numeric provider identity
          determines runtime v2 eligibility.
        - Runtime v2 named campaigns require an explicit service-issued target
          UUID and an unambiguous name advertised by that target's current
          public projection. Manager checks configuration against the provider's
          closed bounded structural parameter schema and forwards at most
          8192 bytes through configuration-json. Evidence revalidates current
          inventory and parameters and remains the scheduling authority.
          The UI selects a target and advertised campaign; campaigns whose
          schema accepts an empty object can run with provider defaults.
          Historical target_id-only first-campaign requests retain v1 meaning.
        - Manager target registration accepts only a registered engine UUID,
          repeats the universal UCI probe, and for the historical v1 profile obtains paths, default-model
          metadata, runtime fingerprint, provider, provider numeric identity,
          and option overrides from that backend-authoritative resource and
          probe. None of those fields are caller supplied.
        - The provider validates paths and option bounds, hashes the engine,
          and idempotently owns target creation. Manager stores only the
          bounded returned summary and refreshed orchestration projection.
        - Manager may enqueue only the provider-defined first campaign against
          the active deployment or an existing service-issued target UUID.
          An omitted target remains omitted so Evidence Service can apply its
          provider-owned active/fallback resolution policy. Manager never
          derives a default from projected target count. Any explicit target
          must be a member of the current provider projection, and the
          resulting jobs retain that target id.
        - Manager may cancel or retry only a service-issued job UUID; arbitrary
          adapter commands, flags, paths, and raw catalog access are forbidden.
        - Target and job projections are bounded, omit provider-owned paths and
          job configuration, and preserve provider lifecycle authority.
    ownership:
      - The Evidence Service remains authority for scheduling, resource admission, evidence normalization, datasets, and qualified timing-profile publication.
      - The manager invokes only its public CLI and reads only its machine-readable status.
      - The manager never opens the Evidence Service SQLite catalog or reads raw artifact storage.
      - Engine and model target identities remain Evidence Service-owned typed configuration.
    current_behavior:
      - The built-in profile appears as an available optional external service.
      - It may be omitted entirely without affecting manager readiness.
      - Registration validates Node and CLI paths before saving.
      - Start, stop, restart, pause, resume, and status use native argument arrays.
      - A status schema mismatch produces incompatible state.
      - Qualified timing profiles appear in the bounded output integration projection.
      - Waiting for a target or idle resources remains healthy service state.

lichess_operational_projection_2026_08_23:
  status: runtime_authoritative
  suite_record: https://github.com/iteathen/uci-arena-installer/issues/166
  owning_issues:
    incidents: https://github.com/iteathen/uci-arena-manager/issues/125
    games: https://github.com/iteathen/uci-arena-manager/issues/126
  activation:
    - "The credential-free status-v3/v4/v5 compatibility slice plus incident,
      game-list, and game-detail projections are runtime-authoritative."
  provider_operations:
    status: provider_status
    incidents: incidents_list
    games: games_list
    game: game_get
  manager_routes:
    - GET /api/v1/providers/{profileId}/status
    - GET /api/v1/providers/{profileId}/incidents
    - GET /api/v1/providers/{profileId}/games
    - GET /api/v1/providers/{profileId}/games/{gameId}
  compatibility:
    - "Manager accepts the current service contract/status v3 during rollout;
      absent additive incident/game operations are feature-unavailable, not
      provider incompatibility."
    - "Status v4 supervision and active-incident summaries are consumed only
      after the exact receipt-verified provider contract declares them. Status
      v5 is accepted as the closed additive archive successor and its archive
      summary is projected without transferring archive authority."
  provider_status_projection:
    status: runtime_authoritative
    route: GET /api/v1/providers/{profileId}/status
    supported_profile: lichess_bot
    provider_operation: provider_status
    response_schema: arena_provider_status_projection_v1
    rules:
      - "Manager resolves the exact receipt-verified provider operation and
        command prefix, appends only the receipt-owned runtime directory, and
        supplies no credential."
      - "The closed status-v3, status-v4, or status-v5 payload is byte- and
        field-bounded before it is projected; unknown fields, unsafe strings,
        invalid counters, malformed supervision/incidents, malformed scheduler
        faults, or malformed rate-limit state fail closed."
      - "Rate-limit deadlines, scheduler faults, stream state, game counts,
        and blockers remain provider-owned observations. Manager displays them
        and cannot clear, shorten, or reinterpret them."
      - "Status v3 explicitly reports supervision and incidents unavailable;
        absence is not an empty incident set and does not make the provider
        incompatible. Status v4/v5 exposes the exact provider summary without
        making Manager a recovery or cooldown authority."
  incident_projection:
    status: runtime_authoritative
    route: GET /api/v1/providers/{profileId}/incidents
    provider_operation: incidents_list
    manager_schema: arena_provider_incident_page_projection_v1
    provider_schema: uci_arena_provider_incident_page_v1
    filters: [active, all]
    maximum_page_size: 100
    rules:
      - "Operation availability comes only from the receipt-verified service
        contract, component contract map, and exact Manager operation catalog."
      - "The public query accepts only filter, after, and limit. Manager maps
        those scalars to the declared flags plus the receipt-owned runtime
        directory and never accepts a caller-selected path or command."
      - "Provider pages are closed, byte-bounded, cursor-monotonic, internally
        consistent, and sanitized before projection."
      - "Operation absence returns availability unavailable with a null page;
        an empty available page is reserved for an invoked provider operation
        that authoritatively returned no matching incidents."
  game_projection:
    status: runtime_authoritative
    list_route: GET /api/v1/providers/{profileId}/games
    detail_route: GET /api/v1/providers/{profileId}/games/{gameId}
    list_operation: games_list
    detail_operation: game_get
    manager_list_schema: arena_provider_game_page_projection_v1
    manager_detail_schema: arena_provider_game_projection_v1
    provider_page_schema: uci_arena_provider_game_page_v1
    provider_detail_schema: uci_arena_provider_game_v1
    scopes: [live, history]
    rules:
      - "Game capability is available only when the receipt-verified service
        contract, manifest contract map, schemas, and exact operation catalog
        consistently declare both game operations."
      - "The list query accepts only scope, before, and limit; detail accepts
        one bounded game id. Manager maps them to fixed declared flags plus
        the receipt-owned runtime directory and supplies no credential."
      - "Pages are closed and byte-bounded, contain at most 100 descending
        cursor rows, match the requested scope, and advance by the oldest
        returned cursor."
      - "Details are closed and byte-bounded. Complete or reconciled archives
        carry at most 2,048 contiguous provider-authored FEN transitions;
        live and summary-only records carry no replay."
      - "Manager projects Provider provenance exactly when present and never
        substitutes current component identity for missing historical data."
      - "Operation absence returns an explicit unavailable projection. Empty
        available pages and missing Provider records retain their distinct
        Provider-authored meanings."
  bounds:
    incident_pages: stable_provider_keyset_cursor
    game_pages: stable_provider_keyset_cursor_maximum_100_records
    replay: maximum_2048_plies
    schemas: closed_project_owned_and_byte_bounded_before_parsing
  rules:
    - "The generic verifier resolves the exact declared command prefix and
      component identity; the Lichess projection validates only bounded
      provider request/response semantics."
    - "Browser input supplies only a profile id plus schema-bounded filters,
      cursor, page size, or game id. It never supplies an executable, path,
      command, operation-catalog selector, argument array, or credential."
    - "Manager never opens provider SQLite, runtime files, credential files,
      or NDJSON logs and never infers incidents or games from those sources."
    - "Incident polling resumes from the provider cursor and deduplicates by
      provider identity. It is not raw-log tailing."
    - "Provider cooldown, recovery, archive completeness, terminal
      immutability, provenance, retention, and historical backfill remain
      provider authority."
    - "Manager rejects replay for summary_only or oversized records and never
      fabricates FENs, moves, clocks, or historical component versions."
  substitution_validation:
    - "A fake provider with different executable layout and operation prefixes
      exercises status, incident, game-list, and game-detail routes without
      Manager product-name or source-layout branches."
    - "Malformed, oversized, secret-looking, path-bearing, unknown-major, and
      cursor-inconsistent outputs fail closed without discarding unrelated
      compatible provider features."

validation:
  - The manager remains ready and local match planning works with neither optional profile configured.
  - Discovery returns an empty candidates array when no hints exist; this is not an error.
  - Manual setup remains available after discovery returns no complete candidate.
  - Saved installer locators are read only from the Manager data root, are schema and component-identity checked, and never enable a service automatically.
  - Book Forge paths containing spaces remain separate argv values.
  - Book Forge status schema mismatches produce incompatible state.
  - Secret-looking fields in adapter output are rejected and redacted.
  - UCI Arena Evidence Service status schema mismatches produce incompatible state.
  - UCI Arena Evidence Service waiting_for_target status remains healthy.
  - Evidence Service paths containing spaces remain separate argv values.
  - Unsupported actions are rejected before any process, broker, or HTTP call.
  - Arbitrary executable paths cannot cross the privileged broker.
  - A startup-owned provider never exposes process start, stop, or restart and
    a direct request for one of those actions fails before process launch.
  - Provider recovery projections preserve exact-ownership and reconciliation
    blockers and invoke only the provider's declared recovery operation.
  - Installed service discovery rejects a Manager API declaration that differs
    between the standalone service contract and arena-component.json.
  - Service status rejects a substituted component id, installed component
    version drift, unknown API major, missing required operation, malformed
    output record, or output kind not owned by that service.
  - Output integration tests prove that raw Evidence observations and
    provider-private catalog contents never enter Manager state.
  - Evidence orchestration tests prove that arbitrary adapters and job actions
    cannot cross the typed provider API.
  - Starting a provider that exits before its public status contract reports
    an active non-stale daemon never yields an observed running state.
  - A fake Lichess provider with a different component entrypoint path and
    operation prefixes exercises discovery and every supported control through
    the public contract without Manager source-layout or command-verb changes.
