meta:
  spec_id: arena_installation_contract_v1
  version: 1
  status: active
  owner: release_engineering

authority:
  suite_release_repository: iteathen/uci-arena-manager
  component_candidate_repository: iteathen/UCI_Arena
  release_steward: "@iteathen"
  official_builder: protected_manager_ci
  stable_publisher: protected_manager_ci_after_production_environment_approval
  forbidden_release_authorities:
    - manager_runtime_service
    - manager_broker
    - developer_workstation
    - book_forge_runtime
    - evidence_service_runtime
  rules:
    - Provider automation may publish only immutable, attested component candidates.
    - Suite composition pins exact provider, commit, manifest, provenance, and artifact digests.
    - Stable promotion republishes the exact tested candidate bytes and never rebuilds.
    - Build identities never receive private signing keys.
    - Private-repository CI always runs the lockfile-backed npm audit. GitHub
      dependency review runs only when the account has enabled that private
      repository feature and DEPENDENCY_REVIEW_ENABLED is explicitly true;
      feature unavailability must not make every private pull request fail.

signed_provenance:
  repository_visibility: private
  implementation: sigstore_cosign_keyless
  cosign_version: 3.0.6
  cosign_installer_action:
    repository: sigstore/cosign-installer
    commit: 6f9f17788090df1f26f669e9d70d6ae9567deba6
  oidc_issuer: https://token.actions.githubusercontent.com
  provider_candidates:
    predicate_type: https://uci-arena.example/attestations/provider-release-result/v1
    trusted_repository: iteathen/UCI_Arena
    trusted_workflow: .github/workflows/component-release.yml
    trusted_workflow_name: Provider component candidate
    lock_fields:
      - provenance_bundle_name
      - provenance_bundle_sha256
      - provenance_certificate_identity
      - provenance_oidc_issuer
      - provenance_workflow_name
      - provenance_workflow_ref
      - provenance_workflow_trigger
    verification:
      - Download the exact lock-pinned artifact, provider result, and Sigstore
        bundle from the same immutable private provider release.
      - Verify all three asset SHA-256 values before interpreting them.
      - Cosign verification pins the exact certificate identity, OIDC issuer,
        provider repository, source commit, workflow name, workflow ref,
        workflow trigger, predicate type, and artifact bytes.
      - Official suite locks accept only the trusted provider workflow from
        refs/heads/main with workflow_dispatch. Source-tag candidates may be
        diagnostic provider outputs but have no official suite authority.
      - Independently decode the verified DSSE payload and require exactly one
        subject for the locked artifact digest plus a predicate exactly equal
        to the separately digest-pinned arena_provider_release_result_v1.
      - The signed provider result workflow_identity must name the trusted
        workflow at the lock-pinned ref and one exact run id and attempt.
  managed_candidates:
    predicate_type: https://uci-arena.example/attestations/managed-component-release-result/v1
    trusted_repository: iteathen/uci-arena-manager
    trusted_workflow: .github/workflows/managed-component-release.yml
    trusted_workflow_name: Managed component candidate
    lock_fields:
      - managed_release_tag
      - managed_result_name
      - managed_result_sha256
      - provenance_bundle_name
      - provenance_bundle_sha256
      - provenance_certificate_identity
      - provenance_oidc_issuer
      - provenance_workflow_name
      - provenance_workflow_ref
      - provenance_workflow_trigger
    verification:
      - Managed Node.js and Stockfish payloads are private immutable prerelease
        candidates and are never accepted from mutable public download URLs.
      - Download the exact lock-pinned archive, managed result, and Sigstore
        bundle from the same immutable private Manager release.
      - Verify all three asset SHA-256 values before interpreting them.
      - Cosign verification pins the exact certificate identity, OIDC issuer,
        Manager repository, source commit, workflow name, workflow ref,
        workflow trigger, predicate type, and artifact bytes.
      - Official suite locks accept only the trusted managed-component workflow
        from refs/heads/main with workflow_dispatch.
      - Independently decode the verified DSSE payload and require exactly one
        subject for the locked archive digest plus a predicate exactly equal
        to the separately digest-pinned arena_managed_component_release_result_v1.
      - The managed result binds every exact upstream input URL and full
        SHA-256, including the Stockfish evaluation network, plus component
        manifest and license digests, native executable smoke evidence, and
        one exact workflow run id and attempt.
      - Stockfish compilation prepositions the full-digest-verified evaluation
        network and never lets the upstream Makefile perform its insecure
        network fallback.
      - Stockfish results and locks retain an HTTPS source offer for the exact
        corresponding source version.
      - Managed component versions preserve the upstream identity exactly and
        accept two- or three-part numeric versions; Stockfish 15.1 must not be
        relabeled as 15.1.0.
  manager_artifacts:
    predicate_type: https://uci-arena.example/attestations/manager-release/v1
    statement_type: https://in-toto.io/Statement/v1
    workflow: .github/workflows/release.yml
    rules:
      - Official Manager provenance is issued only by release.yml at
        refs/heads/main through workflow_dispatch.
      - Each platform Manager build signs one exact multi-subject statement
        covering the Manager archive and every native package emitted for that
        target before the build artifact is uploaded.
      - Final publication signs one exact multi-subject statement covering
        every accepted installer, payload, catalog, TUF metadata file, and
        detached signature before GitHub release creation.
      - The signing workflow immediately verifies its certificate identity,
        issuer, repository, commit, workflow name, ref, trigger, predicate
        type, one exact subject, and the complete signed statement payload.
  fail_closed_rules:
    - Transparency-log inclusion, certificate-chain and signed-certificate
      timestamp verification, claim checking, and exact predicate checking are
      mandatory. Ignore-log, ignore-certificate, ignore-claim, ignore-SCT, and
      unsigned fallback modes are forbidden in release workflows.
    - Signing, transparency-log, download, digest, bundle, claim, or predicate
      failure blocks composition or publication. Repository visibility is
      never weakened to satisfy an attestation storage service.

interfaces:
  catalog: arena_install_catalog_v1
  component: arena_install_component_v1
  provider_result: arena_provider_release_result_v1
  plan: arena_install_plan_v1
  receipt: arena_install_receipt_v1
  transaction: arena_install_transaction_v1
  release_lock: arena_suite_release_lock_v1
  schema_compatibility: reject_unknown_major_accept_additive_minor

setup:
  executable: arena-setup
  operations: [inventory, import, plan, apply, verify, repair, upgrade, uninstall]
  presets: [complete_arena, manager_only, custom]
  machine_output: json
  linux_noninteractive: [yes, offline]
  discovery_is_read_only: true
  apply_requires_explicit_confirmation: true
  elevation: commit_phase_only
  broker_dependency: false
  self_update: false
  selectable_components:
    windows_ui: installer_modify_feature_selection
    linux_ui: package_or_arena_setup_component_selection
    default_on:
      - uci_arena.engine
      - book_forge.service
      - uci_arena_evidence.service
      - lichess.adapter
    rules:
      - Initial Windows installation presents the named suite components as
        selected by default and permits the operator to clear any optional
        component before commit.
      - Apps and Features Modify reopens the same selection surface. Adding or
        removing a selection invokes arena-setup apply or uninstall; it never
        edits immutable component roots directly.
      - Upgrade carries the installed selection forward, restages every
        selected component from the new signed catalog, and does not silently
        reinstall a component the operator previously removed.
      - Linux packages carry arena-setup, the retained signed catalog, and
        lifecycle integration; distro-native service scripts and arena-setup
        provide equivalent component install, repair, upgrade, and removal.
      - Component changes stop affected provider startup registrations before
        payload replacement, stop Manager only for the bounded receipt/config
        commit window, then restart and verify every service selected to run.
      - Each apply and uninstall operation is independently transactional.
        Selection reconciliation keeps Manager stopped across the bounded
        sequence, restores its prior running/stopped state on success or a
        component-operation error, and never reports a failed transition as
        complete.

packaging:
  windows_sources: packaging/windows
  linux_sources: packaging/linux
  windows_outputs: dist/windows
  linux_outputs: dist/linux
  clean_build:
    authority: iteathen/uci-arena-manager
    suite_command: protected .github/workflows/release.yml workflow_dispatch
    manager_component_command: >
      node tools/release/clean-build.mjs --manager-only --platform <target>
    output_manifest:
      schema: arena_clean_build_result_v1
      filename: clean-build-result.json
      binds:
        - suite_version
        - source_commit
        - target_platform
        - build_preset
        - exact_artifact_names
        - artifact_sizes
        - artifact_sha256_digests
    source_requirement: clean_tracked_worktree
    behavior:
      - Run specification and model/product naming gates before compilation.
      - Build the dashboard, configure the native release preset, clean native
        outputs before rebuilding, run native tests, and invoke the existing
        CPack deployment generators.
      - A successful build emits a digest-bound
        arena_clean_build_result_v1 manifest and cannot succeed when any
        required installer is missing, empty, ambiguously named, or accompanied
        by stale installer output.
      - Local and CI Manager-Core builds use the same explicit --manager-only
        command and artifact verifier. Omitting that scope fails closed rather
        than claiming native Manager packages are Complete Arena media.
      - The protected suite workflow is the canonical complete clean build. It
        requires a release-ready lock, builds Manager-Core on both platforms,
        assembles exact provider candidates, runs the acceptance gates, and
        emits the complete installer sets from the accepted bytes.
      - Provider artifacts from iteathen/UCI_Arena remain immutable component
        candidates. They never satisfy or replace a suite installer artifact.
      - Unsigned local artifacts are development installers, not official
        releases. Signing, stable promotion, and protected acceptance remain
        protected-CI-only operations over the exact accepted bytes.
    required_outputs:
      windows-x86_64:
        - UCI-Arena-Setup-<version>-windows-x64-online.exe
        - UCI-Arena-Setup-<version>-windows-x64-offline.exe
        - UCI-Arena-Manager-<version>-windows-x64.msi
      linux-x86_64:
        - uci-arena-setup-<version>-linux-x86_64-online.run
        - uci-arena-setup-<version>-linux-x86_64-offline.run
        - uci-arena-manager_<version>_amd64.deb
        - uci-arena-manager-<version>-1.x86_64.rpm
        - uci-arena-manager-<version>-linux-x86_64.tar.gz
    manager_component_outputs:
      windows-x86_64:
        - UCI-Arena-Manager-<version>-windows-x64.msi
        - UCI-Arena-Manager-<version>-windows-x64.zip
      linux-x86_64:
        - uci-arena-manager_<version>_amd64.deb
        - uci-arena-manager-<version>-1.x86_64.rpm
        - uci-arena-manager-<version>-linux-x86_64.tar.gz
  windows_manager_msi:
    payload_source: complete_cmake_install_tree
    service_registration: cpack_wix_component_patch
    required_payloads:
      - manager_binaries
      - native_runtime_dependencies
      - dashboard_assets
      - installed_contract_schemas
    rules:
      - The arena executable directory is added to the machine PATH through an
        MSI-owned Environment row and is removed from PATH on uninstall.
        Setup never rewrites unrelated PATH entries.
      - The MSI service executable and every required native DLL are installed
        into the same private binary directory before the service is started.
      - The bundle embeds arena-setup with its complete adjacent private
        runtime directory; extracting a lone executable is forbidden.
      - The arena-setup executable package uses no Burn console-redirection
        protocol so inherited standard handles cannot keep the bootstrapper
        blocked after arena-setup exits.
      - Install, repair, and uninstall resolve the embedded catalog and TUF
        metadata from the currently executing Burn package cache directory.
        They never depend on the bootstrapper launch directory or a retained
        source-media working directory.
      - The visible bundle and Programs and Features name is exactly
        UCI Arena Suite Setup. Online, offline, acceptance, commit, and build
        identifiers remain in artifact names and logs; the visible version is
        only the suite semantic version.
      - The service uses the packaged dashboard path and never a source checkout.
      - The bundle resolves one Manager data root and passes that exact path to
        both the Manager MSI service arguments and every arena-setup operation.
        The installed Manager CLI defaults to the same platform data root.
      - After component receipts and generated configurations commit, the
        Windows bundle requires arena-setup to restart the installed Manager
        service so its first active projection reads the new receipt set.
      - On that restart, Manager refreshes every installed optional service
        through its public status contract even when its immutable component
        digest is unchanged.
      - The suite bundle is the only visible Programs and Features entry.
      - Bundle uninstall invokes arena-setup suite uninstall before removing
        the Manager MSI so provider startup registrations cannot be stranded.
      - MSI major upgrades require a strictly greater three-field product
        version. Rebuilding different bytes under the same product version is
        not an upgrade path; use the explicit repair lifecycle instead.
      - The bundle feature-selection state is default-on for Engine, Book
        Forge, Evidence Service, and Lichess adapter, is available again from
        Modify, and is preserved across a major upgrade.
  artifact_names:
    - UCI-Arena-Setup-<version>-windows-x64-online.exe
    - UCI-Arena-Setup-<version>-windows-x64-offline.exe
    - UCI-Arena-Manager-<version>-windows-x64.msi
    - uci-arena-manager_<version>_amd64.deb
    - uci-arena-manager-<version>-1.x86_64.rpm
    - uci-arena-setup-<version>-linux-x86_64-online.run
    - uci-arena-setup-<version>-linux-x86_64-offline.run
  suite_media:
    source: accepted_immutable_candidate_plus_signed_tuf_metadata
    windows_chain: manager_msi_then_arena_setup_complete_with_transactional_rollback
    online_behavior: >
      Carries the accepted core component digest set and permits explicit
      network acquisition of selected external file sets.
    offline_behavior: >
      Carries the same accepted core component digest set and forces
      arena-setup offline mode; credentials and external Syzygy bytes remain
      excluded.
    retained_channel:
      location: manager_data_root/release
      contents: [signed_catalog, signed_tuf_metadata, current_platform_payloads]
      activation: verified_staging_then_atomic_rename
      purpose: >
        Keep repair, upgrade, and the dashboard's explicit download/import
        guidance functional after self-extracting installer media is removed.
      rules:
        - Persist only current-platform or portable catalog artifacts.
        - Verify every retained local artifact by its catalog size and SHA-256.
        - Prefer content-cache hard links and copy only when a hard link is not possible.
        - Never retain credentials or external Syzygy collection bytes.

components:
  required:
    - manager.core
  complete_arena:
    - manager.core
    - uci_arena.engine
    - node_runtime.private
    - stockfish.engine
    - book_forge.service
    - opening_book.standard
    - uci_arena_evidence.service
    - lichess.adapter
  composition_rules:
    - The validated default model is an immutable runtime asset inside the
      uci_arena.engine provider component and is not selected as a nonexistent
      independent catalog component.
    - The Lichess adapter payload is installed disabled. Credentials are not
      accessed and per-user startup is not registered until explicit bot onboarding.
  optional:
    - lichess.adapter
    - opening_book.standard
    - syzygy.wdl.3-4-5
    - syzygy.dtz.3-4-5
    - syzygy.operator_import
    - external_uci_engine
  detect_only:
    - restaurant.training_system

knowledge_assets:
  download_missing_option: true
  command_options:
    all: --download-missing-knowledge
    opening_books: --download-missing-books
    endgame_tables: --download-missing-tablebases
  opening_book:
    default_component: opening_book.standard
    runtime_dependencies: []
    required_files:
      - strong_rare_v1.bin
      - strong_rare_v1.ffstats
      - strong_rare_v1.policy
      - snapshot.manifest.json
    behavior: >
      Install a mutually validated provider snapshot. If only the Book Forge
      bootstrap snapshot is available, label it integration and do not claim
      strength qualification.
  syzygy:
    default_download_component: syzygy.wdl.3-4-5
    optional_download_component: syzygy.dtz.3-4-5
    import_existing: true
    artifact_size_and_digest_source: signed_catalog_only
    whole_collection_guessing: forbidden
    catalog_transport:
      artifact_type: file_set
      manifest_schema: arena_syzygy_file_set_manifest_v1
      portable_target_triple: any-any
      manifest_payload: exact_relative_path_url_size_and_sha256_per_file
      activation: verified_files_then_atomic_directory_pointer
      offline_media_inclusion: false
      rules:
        - The provider candidate contains only the exact signed manifest and
          validation evidence, never the tablebase collection bytes.
        - Planning uses total_size_bytes and file_count committed by the signed
          suite catalog; apply rejects a manifest whose totals differ.
        - Every file is resumably acquired into the content-addressed cache and
          verified before staging. Partial collections never become active.
        - The manifest and catalog may reference only HTTPS or suite-local
          fixture sources; redirects cannot weaken transport or digest checks.
  rules:
    - The engine remains network-free and consumes local immutable assets only.
    - Missing assets are visible and actionable, never silently substituted.
    - Downloading the signed opening-book snapshot never installs or requires
      the Book Forge producer, its private Node runtime, or its 75 GiB
      operational workspace.
    - A user may select download, import an existing directory, or continue in degraded mode.
    - Inventory reports an activated knowledge asset as installed_managed only
      when an installed-managed receipt owns activation files that still exist
      under the configured knowledge root with their recorded sizes. Full
      content integrity remains the verify command's responsibility.
    - Inventory projects a validated saved or bounded-discovery opening-book or
      Syzygy locator into the knowledge summary as detected_unmanaged when no
      installed-managed activation is present. Syzygy counts and bytes cover
      only regular .rtbw and .rtbz files directly inside the selected directory;
      the projection never recurses, follows links, copies, or modifies files.
    - Dedicated opening_book.* and syzygy.* component identities alone own
      knowledge-file activation; an engine capability named opening_book or
      syzygy describes consumption support and never makes the engine payload
      an activation source.
    - When a signed opening_book.* or syzygy.* component activates and no
      explicit saved locator exists, arena-setup transactionally saves the
      verified activation directory as the selected locator before generating
      consumer configuration. An explicit imported locator always wins.

discovery:
  interface: arena_setup_discovery_v1
  locator_interface: arena_saved_locator_v1
  kinds:
    - opening_book
    - syzygy
    - uci_engine
    - book_forge
    - evidence_service
    - timing_profile
    - lichess_single_game_profile
    - lichess_capacity_profile
    - lichess_transport_profile
    - lichess_token_path
    - restaurant
  precedence:
    - install_receipt
    - saved_locator
    - provider_manifest
    - discovered
    - unresolved
  bounded_sources:
    - install_receipts
    - saved_locators
    - package_databases
    - windows_registry
    - windows_services
    - windows_task_scheduler
    - systemd
    - path_environment
    - standard_install_roots
    - provider_manifests
    - user_selected_roots
  user_selected_root_behavior:
    maximum_directory_depth: 1
    multiple_explicit_roots: supported
    detected_at_root_or_direct_child:
      - opening_book_file_or_flat_directory
      - syzygy_directory
      - known_uci_engine_filename
      - provider_component_manifest
    ordering: normalized_path_ascending
    rule: >
      A user-selected or explicitly mounted root is inspected only at the root
      and its direct non-symbolic-link children. It is never treated as
      permission to recurse through the containing volume.
    explicit_mount_rule: >
      Opening-book, Syzygy, engine, and provider paths mounted at different VM
      locations are each supplied as an independent bounded scan root. The
      acceptance harness never requires a synthetic combined directory,
      symbolic link, junction, or copy of provider-owned assets.
  whole_disk_recursive_scan: forbidden
  symbolic_link_traversal: forbidden
  registration_after_detection: explicit_only
  engine_probe: [process_launch, uciok, readyok, typed_options, legal_startpos_bestmove]
  engine_naming:
    uci_arena_executable_names: [uci_arena_engine.exe, uci_arena_engine]
    model_branded_executable_aliases: forbidden
    rule: >
      Model package labels are not product identities and never participate in
      installer discovery. Other UCI engines require their own recognized
      product executable or an explicit operator-selected path.
  browse_contract:
    returned_per_kind: [selection, filters, hints, managed_copy_allowed]
    paths_are_non_secret: true

local_import:
  interface: arena_setup_import_result_v1
  command: arena-setup --json import --kind KIND --path PATH
  default_mode: in_place_reference
  saved_location: manager_data_root/locators
  managed_copy:
    allowed_kinds: [opening_book, lichess_single_game_profile]
    opening_book_maximum_bytes: 268435456
    opening_book_maximum_files: 64
    lichess_profile_closure_maximum_bytes: 67108864
    lichess_profile_closure_maximum_files: 16
    staging: immutable_then_atomic_activation
    receipt: arena_install_receipt_v1
  validation:
    opening_book: regular_file_or_flat_directory
    syzygy: directory_with_rtbw_or_rtbz
    uci_engine: full_uci_startup_interrogation
    book_forge: provider_root_or_regular_cli_entrypoint
    evidence_service: provider_root_or_regular_cli_entrypoint
    timing_profile: qualified_uci_time_profile_v3_regular_file
    lichess_single_game_profile: >
      qualified_uci_arena_single_game_profile_v1_with_complete_hash_verified_evidence_closure
    lichess_capacity_profile: qualified_uci_arena_lichess_capacity_profile_v1_regular_file
    lichess_transport_profile: qualified_uci_arena_lichess_transport_profile_v2_regular_file
    lichess_token_path: path_reference_only_never_read
    restaurant: detect_only_import_forbidden
  rules:
    - Import never scans outside the supplied path and its explicitly allowed flat entries.
    - In-place imports save only normalized locators and never copy provider-owned data.
    - Syzygy tablebases are always referenced in place.
    - Timing profiles remain identity-bound in-place references and are never copied or rewritten.
    - A Lichess single-game profile is copied without rewriting into immutable
      Manager-owned storage together with its bounded, hash-verified evidence
      closure. Relative evidence paths are resolved only against the profile
      directory and bounded ancestors of the explicitly selected profile; an
      unsafe, ambiguous, missing, oversized, or hash-mismatched closure is
      rejected before activation.
    - Lichess capacity and transport profiles remain qualified in-place
      references and are never copied or rewritten. The capacity profile must
      bind the exact selected single-game profile digest.
    - Consumer activation verifies timing and single-game profile executable,
      model, provider, and hardware identity against the exact installed
      engine and model. An incompatible profile remains discoverable evidence
      but is never presented as applied.
    - A successful import transaction regenerates and verifies every installed
      consumer configuration and active-model pointer affected by that locator
      before committing the locator. Failure restores the previous locator,
      configurations, and pointers.
    - Managed-copy opening books publish the activated immutable directory as
      the saved opening-book locator in the same transaction.
    - Installing Evidence Service projects explicit timing-profile locators through its public profile-list command.
    - Managed-copy opening books reject symbolic links, nested directories, and payloads larger than the declared maximum.
    - Lichess token contents are never opened, hashed, copied, logged, returned, or placed in argv.
    - A Lichess token locator must reference an operator-owned file outside
      Manager-owned data and immutable installed component roots. Saving a
      token file under Manager data is rejected before locator persistence.
    - Book Forge receives an imported Lichess credential only as the saved
      token-file path in its generated provider configuration. The installer
      never opens the referenced file, and a later token-path import
      transaction regenerates the installed Book Forge configuration and
      invokes Book Forge's bounded public acquisition retry-auth operation.
      The provider response must confirm a ready credential configuration;
      failure rolls back the locator and generated configuration.
    - Restaurant remains visible as detect-only and is never registered, copied, installed, started, or controlled.

vm_mounts:
  protected_runner_provisioning:
    implementation: tools/release/provision-hyperv-runner.ps1
    physical_host_registration: forbidden
    runner_registration: repository_scoped_ephemeral
    runner_update: disabled_and_version_pinned
    host_access:
      account: generated_least_privilege_matching_local_identity
      opening_books: read_only_smb
      syzygy: read_only_smb
      workspace: change_smb
      firewall_scope: hyper_v_default_switch_subnet_only
    secret_lifecycle:
      - Registration tokens are obtained just in time and embedded only in the
        disposable guest bootstrap.
      - The guest bootstrap deletes itself after runner registration.
      - Lichess shares are omitted unless the explicit Lichess runner mode is
        selected.
  immutable_asset_root:
    runner_environment: ARENA_VM_ASSET_ROOT
    contents:
      - opening_books
      - syzygy
      - optional_external_uci_engines
      - optional_provider_component_roots
    installation_mode: in_place_reference
    copy_into_manager_storage: forbidden
    acceptance_evidence:
      - bounded_scan_discovers_books_and_syzygy
      - separate_explicit_mount_roots_are_supported
      - explicit_import_saves_normalized_locator
      - no_managed_receipt_claims_asset_ownership
      - file_name_size_and_timestamp_metadata_unchanged
  writable_workspace_root:
    runner_environment: ARENA_VM_WRITABLE_ROOT
    contents:
      - manager_state
      - book_forge_workspace
      - evidence_workspace
    minimum_residual_gib: 75
  lichess_secret_mount:
    runner_environment: ARENA_LICHESS_TOKEN_FILE
    mode: path_reference_only
    account: existing_operator_bot_account
    rules:
      - The acceptance system does not require or create a second BOT account.
      - The mounted token path is imported through Manager before it is passed
        blindly to the installed adapter process that requires it.
      - Manager and release automation never open, copy, hash, print, or embed
        token contents.

capacity:
  per_volume:
    - download_cache_bytes
    - staging_bytes
    - installed_bytes
    - backup_bytes
    - operational_reserve_bytes
    - peak_required_bytes
  shared_dependency_count: once
  staging_headroom: max_1_gib_or_10_percent
  book_forge_residual_workspace_gib: 75
  evidence_residual_workspace_gib: 75
  same_volume_residual_threshold: maximum_not_sum
  complete_preset_insufficient_workspace: block
  custom_preset_insufficient_workspace: install_disabled_only

transaction:
  staging: immutable
  verification: before_activation
  activation: atomic_version_pointer
  journal: durable_before_each_side_effect
  backup: before_replacement_or_migration
  failure: restore_previous_activation_and_service_state
  normal_uninstall: preserve_user_data
  manager_data_root_retention:
    windows_default: "C:\\ProgramData\\UCI Arena Manager"
    purpose: >
      Normal uninstall removes executable authority and managed component
      receipts while preserving operator state required for reinstall,
      recovery, audit, and large-asset reuse. Retention is deliberate and must
      not be inferred from an implementation-wide decision to leave a
      directory behind.
    preserved_on_normal_uninstall:
      - path: arena.db
        reason: canonical Manager resources, operations, audit records, and history
      - path: client.key
        reason: local CLI and browser-pairing continuity after reinstall
        security: preserve file ACLs and never print or export the key
      - path: knowledge/
        reason: imported or downloaded opening books and tablebases may be large or user-owned
      - path: locators/
        reason: validated path-only references and qualified profile selections
      - path: release/
        reason: verified current-platform catalog, TUF metadata, and payloads used by repair
      - path: trust/
        reason: highest verified TUF versions required for rollback protection
      - path: cache/
        reason: content-addressed verified downloads that avoid unnecessary reacquisition
        authority: non_authoritative_until_digest_reverified
      - path: transactions/
        reason: recovery and audit evidence for completed or interrupted installer operations
      - path: workspaces_outside_data_root
        reason: provider-owned operational data is not installer payload
    removed_on_normal_uninstall:
      - every receipt-selected immutable component root
      - every provider startup registration owned by an installed receipt
      - every component receipt JSON document
      - the Manager Windows service and MSI-owned program files
    rules:
      - The receipts directory may remain empty; no installed component
        authority survives merely because the directory exists.
      - Interrupted staging or rollback paths remain recovery evidence until a
        later verified operation resolves them; they are never silently
        activated.
      - Normal uninstall does not promise secure erasure. Purge is a separate,
        explicit, previewed operation and may remove only declared paths.
      - Reinstall revalidates retained locators, release media, cache entries,
        trust state, and qualified profiles before consuming them.
  suite_uninstall:
    command: arena-setup uninstall --all --yes
    ordering: startup_capable_consumers_before_runtimes_and_dependencies
    rules:
      - Provider-owned startup adapters are invoked through their verified
        installed startup, CLI, or adapter entrypoint and private Node runtime
        before payload removal, using the provider's component-specific managed
        workspace argument.
      - Uninstall fails closed if a provider startup registration cannot be
        stopped and removed.
      - Payload removal uses a bounded retry after provider shutdown so Windows
        process teardown cannot strand a partially removed immutable root.
      - Removing a shared runtime by itself is rejected while an installed
        startup-capable provider still depends on it.
      - Normal suite uninstall removes every managed receipt and immutable
        component root, including an empty per-component parent directory,
        while preserving workspaces, locators, imported in-place assets, and
        retained release media.
      - A Windows bundle stamps its immutable Burn provider key as bundle_owner
        on every selected component receipt before related-bundle removal.
      - Bundle-driven uninstall removes only receipts whose bundle_owner exactly
        matches the calling bundle. A related older bundle treats an empty
        owner-scoped selection as a successful no-op and cannot remove receipts
        adopted by the newly installed bundle.
  purge: preview_confirm_optional_export
  generated_service_configuration:
    owner: arena_setup
    location: selected_service_workspace
    inputs: exact_receipt_verified_dependency_entrypoints
    book_forge:
      - stockfish
      - saved_lichess_token_path_reference_when_available
    evidence_service:
      - uci_arena_engine
      - installed_model_root
      - stockfish
      - complete_game_referee
      - manager_owned_runtime_models_root
      - manager_owned_active_model_pointer
      - explicit_timing_profile_imports
      - exact_installed_engine_digest
    lichess_adapter:
      - uci_arena_engine
      - installed_model_root
      - selected_qualified_timing_profile
      - selected_qualified_single_game_profile
      - selected_qualified_capacity_profile
      - selected_qualified_transport_profile
      - selected_opening_book_and_sidecars
      - selected_syzygy_directory
      - token_path_excluded
    rollback: restore_previous_configuration
  provider_startup:
    owner: provider_public_adapter_invoked_by_arena_setup
    install_trigger: enabled_non_credential_gated_component_apply_repair_or_upgrade
    receipt_field: startup
    rules:
      - An enabled component declaring startup_install is not committed until
        its verified installed entrypoint reports installed true.
      - Credential-gated Lichess startup is never installed merely because its
        component and token-file locator exist. Its verified adapter entrypoint
        remains available for explicit startup, status, and uninstall, and
        suite uninstall removes any provider-owned startup registration before
        payload removal.
      - When a provider reports matchesCurrentConfiguration, it must be true.
        Manager never reinterprets or substitutes a provider health contract.
      - Verify invokes the provider's public startup status operation and fails
        when an installed startup receipt no longer reports installed true or
        reports matchesCurrentConfiguration false.
      - Transaction rollback invokes startup_uninstall before restoring or
        removing the provider payload.
      - Disabled component binaries are installed without startup registration.
  service_transition_scripts:
    owner: arena_setup_and_native_package_lifecycle
    windows:
      before_change: stop_affected_provider_startup_then_manager
      after_change: restart_manager_then_verify_selected_provider_startup
    linux:
      before_change: prerm_or_arena_setup_stop_affected_services
      after_change: postinst_or_arena_setup_daemon_reload_enable_start_verify
    rules:
      - Scripts use typed service identities and provider public lifecycle
        entrypoints; arbitrary executable, argv, and shell input are forbidden.
      - Component startup outcomes are recorded in the install transaction.
        The installer wrapper preserves the Manager service's prior
        running/stopped state across its bounded multi-operation feature
        reconciliation.
      - A component is never reported installed, removed, repaired, or upgraded
        until its required service transition has completed successfully.
      - If the operating system refuses the final Manager service restoration,
        setup returns an error and leaves verified receipts as the authoritative
        recovery state; it never claims an exact rollback that did not occur.
  installed_engine_handoff:
    owner: arena_setup
    rules:
      - Saved opening-book and Syzygy locators are revalidated immediately
        before a generated consumer configuration is activated.
      - A flat opening-book directory selects strong_rare_v1.bin when present;
        otherwise it must contain exactly one supported book file. Ambiguous
        directories require the user to import the intended file explicitly.
      - BookFile, BookStatsFile, BookPolicyFile, and SyzygyPath retain their
        normalized in-place paths; large assets are never copied.
      - Lichess adapter receipts expose the Manager-generated configuration
        path used to hand the selected assets to the installed UCI engine.
      - Verify regenerates the expected configuration from receipt-verified
        component roots and currently valid saved locators, and fails on
        missing, stale, or altered generated configuration.
      - When an exact qualified timing profile is selected, arena-setup writes
        and transactionally verifies an Evidence-compatible active-model
        pointer bound to the installed engine, model root, provider, options,
        and the executable digest computed from the verified installed
        entrypoint. A profile digest is never substituted for the installed
        executable digest. It never points the service at its own
        configuration file.
      - Lichess activation fails closed before credential access when timing,
        single-game, capacity, or transport evidence is missing, incomplete,
        or incompatible with the exact installed engine/model identity.
      - Runtime verification requires opening_book_active and syzygy_active,
        not merely the presence of saved locators.
      - Protected live acceptance requires the selected timing profile to be
        accepted, applied, exact-identity-bound, and provider-safety-qualified
        with a positive reserve after installer-owned knowledge locators are
        applied.
  repair:
    rules:
      - Repair restages every selected component from verified release media
        even when the installed version is already current.
      - Repair regenerates and verifies installer-owned consumer
        configurations and active-model pointers from current saved locators.
  upgrade:
    rules:
      - Upgrade restages every selected component so the new bundle atomically
        adopts all selected receipts before Burn removes a related older bundle.

trust:
  metadata: tuf
  roles: [root, targets, snapshot, timestamp, candidate, stable, offline]
  root_keys: offline
  root_bootstrap: exact_root_metadata_sha256_compiled_into_official_arena_setup
  rollback_protection: required
  rollback_state: highest_verified_root_targets_snapshot_and_timestamp_versions_under_manager_data
  artifact_digest: sha256
  windows_defense_in_depth: authenticode
  linux_defense_in_depth: signed_apt_and_rpm_metadata
  secrets_in_argv_logs_catalogs: forbidden

acceptance:
  - Manager-only install works without Node.js.
  - Windows bootstrap and Manager binaries launch on a clean supported Windows
    image without a preinstalled Visual C++ redistributable.
  - Windows GUI acceptance installs from the visible bootstrapper, proves the
    packaged Manager service starts with its native DLLs and dashboard assets,
    verifies the complete receipt-selected suite, and uninstalls through the
    same bundle with no Manager service, provider startup registration,
    immutable component root, or receipt left behind.
  - Complete Arena installs Manager, UCI Arena, Book Forge, and Evidence Service without a source checkout.
  - The Windows Complete acceptance launches installed entrypoints from their
    receipts, loads the bundled model, builds and validates a Book Forge
    integration snapshot, completes a minimal Evidence dataset job, and
    requires Manager to project both outputs through the public CLI contracts.
    It leaves installer-generated provider configuration unchanged. Because a
    developer workstation may legitimately fail Evidence background-idle
    admission, the bounded Evidence workload uses a separate acceptance-only
    configuration copy that changes resource thresholds but retains the exact
    installer-generated dependency and workspace paths.
  - Complete and protected live acceptance register installed optional-service
    startup adapters, uninstall the complete receipt-selected suite, prove all
    startup registrations, immutable version roots, and receipts were removed
    without removing workspaces, imported assets, saved locators, or retained
    media, reinstall from the candidate catalog, verify every new receipt, and
    only then run end-to-end product and service checks.
  - Missing opening books and tablebases can be downloaded from exact signed catalog entries or imported explicitly.
  - Protected VM acceptance mounts existing opening books and Syzygy files,
    discovers them through a bounded selected-root scan, and imports them in
    place without copying or modifying the mounted collection.
  - Protected VM acceptance places Book Forge and Evidence state on a separate
    writable workspace volume with the required residual capacity.
  - Manager validates and projects Book Forge snapshot identities and Evidence Service dataset identities through their public CLIs.
  - Offline installation uses the same verified component bytes as stable online installation.
  - Interrupted apply, repair, upgrade, and uninstall preserve a recoverable transaction state.

release_gate_order:
  - provider_attestations
  - reviewed_release_lock
  - immutable_suite_candidate
  - manager_only_clean_windows_and_linux
  - complete_clean_windows_and_linux
  - external_discovery_and_in_place_import
  - bounded_syzygy_manifest_range_and_real_fixture
  - protected_lichess_live_acceptance
  - release_steward_approval
  - remote_signing
  - exact_digest_publication
release_gate_rules:
  - Provider attestations and Manager release provenance are independently
    verifiable Sigstore bundles; passing the reviewed lock or ordinary GitHub
    artifact transport does not substitute for cryptographic verification.
  - Complete Arena acceptance excludes Lichess credentials and Syzygy bytes;
    those are separate opt-in gates over the same immutable candidate.
  - Production signing jobs require every preceding applicable gate and cannot
    turn an inconclusive optional-service result into a pass.
  - Clean-VM coverage includes Windows 11, Windows Server, Ubuntu, Debian,
    Fedora, and a RHEL-family image on protected ephemeral runners.
  - The Lichess gate uses the existing operator BOT identity, a BOT-titled
    public online opponent, casual standard chess, no more than three
    challenges in twenty minutes, and exactly one required completed game. It
    never requires or provisions a second BOT account.
  - The Lichess gate resolves the installed UCI executable and immutable
    working root plus the installed Lichess configuration template from
    receipts and passes them with the installed model root and configured
    shared knowledge root to the installed adapter. It never relies on
    provider-checkout-relative template paths.
  - The bounded protected Lichess gate requires the installed, exact-identity
    calibrated time profile to be accepted and applied with provider safety
    qualification and a positive service reserve. Exact single-game and
    one-child capacity qualification remain mandatory.
  - The Syzygy gate verifies signed full manifests without downloading the full
    collection, exercises range downloads against tiny local fixtures, and
    probes either a pinned real three-man test fixture or an explicitly supplied
    SYZYGY_TEST_ROOT in place without copying it.
  - Every accepted Syzygy provider result records a successful one-byte range
    probe for every exact manifest member; the Manager rejects missing,
    incomplete, or larger-transfer range evidence.
  - The signed one-byte probe is represented as status
    availability_verified with content_verified false, exact manifest file
    count, and exactly one transferred byte per file. Full content integrity
    is enforced later against each signed per-file SHA-256 during acquisition;
    the availability probe must never claim that it verified full content.
