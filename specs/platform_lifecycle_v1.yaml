meta:
  spec_id: arena_platform_lifecycle_v1
  version: 1
  status: active
  owner: platform

main_service:
  privilege: unprivileged
  readiness_contract:
    schema: arena_manager_readiness_v1
    endpoint: /api/v1/system/readiness
    authentication: bearer_after_keyed_server_identity_proof
    ready_state: core_ready
    core_startup_deadline_ms: 120000
    requirements:
      - Core readiness means durable storage recovery, LocalAuth publication,
        handler registration, listener binding, and entry into the event loop
        are complete.
      - A successful TCP connect is not readiness and a listener that cannot
        prove Manager identity can never satisfy the launcher.
      - Provider status refresh and installed Engine reconciliation begin only
        after core readiness and never delay desktop pairing.
      - System status exposes pending, running, complete, complete_with_errors,
        or failed reconciliation state with bounded phase, progress, and error
        detail while core control remains available.
  windows_modes:
    per_user:
      account: interactive_user
      lifecycle: on_demand_native_launcher_process
      elevation: forbidden
    per_machine:
      account: LocalService
      lifecycle: windows_service
      elevation: required_for_install_modify_update_uninstall
  linux_account: uci-arena
  windows_stop_contract:
    - Service startup remains START_PENDING until the loopback control plane
      has entered its event loop; it never reports RUNNING before stop control
      can be honored.
    - A stop requested during startup remains latched and is honored as soon
      as the event loop begins, so package replacement cannot strand the
      service in STOP_PENDING.
    - Typed service-control callers wait for the requested terminal SCM state
      with a bounded deadline and report the observed state on failure.
  startup_reconciliation:
    execution: background_after_event_loop_entry
    ownership: manager_service
    shutdown: bounded_join_of_current_external_operation

broker:
  privilege: root_or_local_system
  transport: local_authenticated_ipc
  network_listener: false
  request_fields: [request_id, target_id, action, expiry, authentication]
  allowed_actions: [status, start, stop, restart]
  forbidden_fields: [executable, argv, shell, working_directory]
  policy: administrator_owned_allowlist

child_isolation:
  windows: job_objects
  linux: cgroups_or_systemd_scopes
  required:
    - process_tree_termination
    - cpu_limit
    - memory_limit
    - graceful_then_forced_stop

packages:
  release_authority: uci_arena_installer_repository
  manager_candidate_authority: manager_repository_explicit_component_release
  official_build_location: installer_repository_protected_release_only
  windows: [signed_per_user_setup_exe, signed_per_machine_setup_exe, per_user_msi, per_machine_msi, zip]
  linux: [deb, rpm, signed_portable_run, tar_gz]
  linux_validation:
    blocking: [lintian, rpmlint, systemd_analyze]
    before_provenance: true
    maintainer_scripts: distro_specific_and_executable
    release_binaries: stripped
    public_manual_pages: reproducibly_gzip_compressed
    policy_metadata: [maintainer, description, license, copyright, changelog]
    standalone_static_linkage:
      allowed: reviewed_exact_executable_and_library_pairs_only
      lintian_override: exact_context_with_review_comment
      bundled_license_evidence: required
      broad_override: forbidden
  normal_uninstall: preserve_data
  purge: explicit_preview_confirm_optional_export
  self_update: false
  cli:
    windows_path_scope: matching_install_scope_msi_owned
    linux_manpage: share/man/man1/arena.1
  manager_component_runtime:
    source: declared_entrypoint_runtime_dependency_closure
    whole_package_manager_bin_copy: forbidden
  selectable_services:
    initial_state: selected
    modify: supported
    major_upgrade: preserve_selection
    lifecycle: typed_stop_commit_start_verify_with_rollback
  installer:
    executable: arena-setup
    source_repository: iteathen/uci-arena-installer
    manager_source_copy: forbidden
    privilege: unprivileged_plan_elevated_commit_only
    broker_dependency: false
    allowed_operations: [inventory, plan, apply, verify, repair, upgrade, uninstall]
    runtime_service_release_authority: false
    windows_scope:
      recommended: per_user
      alternatives: [per_user, per_machine]
      rules:
        - Both fixed-scope packages use the same tested executable bytes and an
          MSI-owned immutable scope marker; package composition, not a second
          native compilation, selects user or machine lifecycle behavior.
        - The per-user package installs below LocalAppData/Programs, uses
          package-owned HKCU component key paths, and must pass MSI profile
          validation without suppressing ICE38.
        - arena-setup accepts an explicit fixed scope from its owning bundle;
          per-user scope forbids service restart and LocalService ACL mutation.
        - Per-user install, Modify, repair, update, and uninstall touch only
          user-owned files, user PATH, and per-user package state and must not
          request elevation.
        - Per-machine lifecycle owns Program Files, ProgramData, machine PATH,
          and the Windows service and therefore requires Windows elevation.
        - Setup never attempts an elevation bypass, AlwaysInstallElevated,
          credential caching, or silent cross-scope migration.

desktop_application:
  windows:
    subsystem: gui
    shortcut: start_menu
    icon_formats: [ico]
  linux:
    launcher: desktop_entry
    terminal: false
    icon_formats: [svg, png]
    runtime_dependencies:
      - WebKitGTK_4_1
      - GTK_3
      - zenity_or_portal_compatible_picker
  session:
    view: packaged_react_dashboard_in_thin_native_host
    runtime_authority: manager_service_only
    manager_endpoint: authenticated_loopback_http
    authentication: one_use_pairing_token
    startup:
      readiness_deadline_ms: 120000
      requirements:
        - The per-user launcher retains the service process in its kill-on-close
          Job Object for the complete desktop lifetime.
        - Crossing an obsolete GUI-local observation interval never closes the
          Job Object or terminates a live service that remains within the
          service-owned readiness deadline.
        - Process exit, authenticated-readiness failure, desktop-helper failure,
          and WebView initialization failure remain distinct diagnostic
          categories with one bounded non-secret detail.
        - A second launcher activates the existing desktop authority and never
          creates another Manager service or window authority.
    interactive_authority:
      - path_picker
      - typed_component_setup
      - write_only_operator_credential_materialization
    bridge: authenticated_narrow_typed_loopback_capabilities_only
    arbitrary_process_execution: forbidden
    external_browser:
      entrypoint: arena ui
      role: optional_monitoring_and_troubleshooting
      interactive_binding: random_loopback_picker_port
