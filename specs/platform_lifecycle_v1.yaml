meta:
  spec_id: arena_platform_lifecycle_v1
  version: 1
  status: active
  owner: platform

main_service:
  privilege: unprivileged
  windows_account: LocalService
  linux_account: uci-arena

broker:
  privilege: root_or_local_system
  transport: local_authenticated_ipc
  network_listener: false
  request_fields: [request_id, target_id, action, expiry, authentication]
  allowed_actions: [status, start, stop, restart]
  forbidden_fields: [executable, argv, shell, working_directory]
  policy: administrator_owned_allowlist

child_isolation:
  windows: job_objects
  linux: cgroups_or_systemd_scopes
  required:
    - process_tree_termination
    - cpu_limit
    - memory_limit
    - graceful_then_forced_stop

packages:
  release_authority: manager_repository_protected_ci
  official_build_location: protected_ci_only
  windows: [signed_setup_exe, msi, zip]
  linux: [deb, rpm, signed_portable_run, tar_gz]
  normal_uninstall: preserve_data
  purge: explicit_preview_confirm_optional_export
  self_update: false
  cli:
    windows_path_scope: machine_msi_owned
    linux_manpage: share/man/man1/arena.1
  selectable_services:
    initial_state: selected
    modify: supported
    major_upgrade: preserve_selection
    lifecycle: typed_stop_commit_start_verify_with_rollback
  installer:
    executable: arena-setup
    privilege: unprivileged_plan_elevated_commit_only
    broker_dependency: false
    allowed_operations: [inventory, plan, apply, verify, repair, upgrade, uninstall]
    runtime_service_release_authority: false

desktop_application:
  windows:
    subsystem: gui
    shortcut: start_menu
    icon_formats: [ico]
  linux:
    launcher: desktop_entry
    terminal: false
    icon_formats: [svg, png]
  session:
    binding: random_loopback_port
    authentication: unguessable_per_process_token
    authority: [path_picker, typed_component_setup]
    arbitrary_process_execution: forbidden
